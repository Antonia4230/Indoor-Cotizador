<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap');
:root{
  --bg:#0d1b3e;--bg2:#152447;--bg3:#1c2e58;--bg4:#243568;
  --bdr:rgba(255,255,255,0.08);--bdr2:rgba(255,255,255,0.15);
  --gold:#F5A623;--gold-d:#d4891a;--gold-l:#F5A623;--gold-xl:#ffc04a;
  --gold-bg:rgba(245,166,35,0.10);--gold-bg2:rgba(245,166,35,0.18);
  --gold-grd:linear-gradient(135deg,#f7b84a 0%,#F5A623 50%,#d4891a 100%);
  --txt:#ffffff;--txt2:#c0d0f0;--txt3:#7a90bb;
  --green:#1a6e30;--green-l:#3DAF76;
  --red:#c0392b;--red-l:#ff8080;
  --blue:#1a4e8a;--blue-l:#7ab0f5;
  --r:8px;--rl:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI','Inter',sans-serif;background:var(--bg);min-height:100vh;color:var(--txt);font-size:14px;line-height:1.5;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg2);}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px;}
.nav{position:sticky;top:0;z-index:300;background:linear-gradient(90deg,#0d1b3e 0%,#152447 100%);border-bottom:2px solid var(--gold);backdrop-filter:blur(16px);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:58px;flex-wrap:wrap;}
.nav-logo{display:flex;align-items:center;gap:11px;}
.nav-logo img{height:32px;filter:brightness(1.1);}
.nav-logo-fb{font-family:Space Grotesk;font-weight:800;font-size:20px;display:none;}
.nav-logo-fb .i{color:var(--gold-l);}.nav-logo-fb .d{color:var(--txt);}.nav-logo-fb .o{color:var(--txt2);}
.nav-sub{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);border-left:1px solid var(--bdr2);padding-left:11px;line-height:1.3;}
.nav-tabs{display:flex;gap:4px;}
.nav-tab{padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;color:#c0d0f0;border:none;background:transparent;font-family:inherit;transition:all .15s;white-space:nowrap;}
.nav-tab:hover{color:var(--gold-l);background:var(--gold-bg);}
.nav-tab.on{background:rgba(245,166,35,.18);color:var(--gold-xl);border:1px solid rgba(245,166,35,.35);}
.nav-right{display:flex;gap:8px;align-items:center;}
.hero{background:linear-gradient(135deg,#0d1b3e 0%,#1a2f6a 50%,#1e3580 100%);border-bottom:2px solid var(--gold);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.hero-left{min-width:150px;}
.hero-exec-lbl{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);margin-bottom:3px;}
.hero-exec{font-family:Space Grotesk;font-size:15px;font-weight:800;color:#FFF;text-shadow:0 0 8px rgba(255,255,255,.9),0 0 20px rgba(255,255,255,.4);}
.hero-exec-co{font-size:10px;color:var(--gold);font-weight:500;margin-top:2px;}
.hero-center{flex:1;text-align:center;padding:0 12px;}
.hero-eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
.hero-title{font-family:Space Grotesk;font-size:24px;font-weight:800;letter-spacing:-.03em;color:#FFF;text-shadow:0 0 10px rgba(255,255,255,.95),0 0 25px rgba(255,255,255,.55),0 0 50px rgba(200,220,255,.3);}
.hero-badge{display:flex;align-items:center;gap:7px;justify-content:center;margin-top:5px;flex-wrap:wrap;}
.hero-badge span{font-size:9px;font-weight:600;letter-spacing:.06em;color:var(--txt3);text-transform:uppercase;}
.hero-badge .dot{width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:.5;}
.hero-right{min-width:120px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.hero-right img{height:36px;filter:brightness(1.1);}
.wrap{max-width:960px;margin:0 auto;padding:22px 18px 100px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--r);font-weight:600;cursor:pointer;font-size:13px;border:none;font-family:inherit;transition:all .18s;white-space:nowrap;}
.btn-p{background:var(--gold-grd);color:#ffffff;box-shadow:0 2px 10px rgba(245,166,35,.25);}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(191,136,64,.4);}
.btn-p:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-g{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);color:#ffffff;}
.btn-g:hover{border-color:var(--gold);color:var(--gold-xl);}
.btn-red{background:rgba(184,48,48,.15);border:1px solid rgba(184,48,48,.3);color:var(--red-l);}
.btn-green{background:rgba(42,122,82,.2);border:1px solid rgba(42,122,82,.35);color:var(--green-l);}
.btn-sm{padding:6px 12px;font-size:12px;}
.card{background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);border:1px solid var(--bdr);border-radius:var(--rl);padding:16px 18px;margin-bottom:12px;transition:border-color .2s;}
.card:hover{border-color:var(--bdr2);}
.step-title{font-family:Space Grotesk;font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:3px;color:#FFF;text-shadow:0 0 8px rgba(255,255,255,.9),0 0 20px rgba(255,255,255,.5),0 0 40px rgba(200,220,255,.25);}
.step-sub{font-size:12px;color:var(--txt3);margin-bottom:14px;}
.label{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin-bottom:7px;}
input,select{width:100%;background:var(--bg4);border:1px solid rgba(255,255,255,.12);color:#ffffff;padding:9px 12px;border-radius:var(--r);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;}
input:focus,select:focus{border-color:var(--gold);}
select option{background:var(--bg3);}
input[type=number]{-moz-appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr 1fr;}}
@media(max-width:380px){.g2,.g3,.g4{grid-template-columns:1fr;}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:20px;border:1.5px solid rgba(255,255,255,.09);cursor:pointer;font-size:12px;font-weight:500;background:transparent;color:var(--txt2);transition:all .15s;font-family:inherit;}
.chip:hover{border-color:var(--gold-l);color:var(--gold-l);}
.chip.on{border-color:var(--gold);background:var(--gold-bg2);color:var(--gold-xl);}
.srow{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:var(--r);border:1px solid var(--bg3);cursor:pointer;margin-bottom:5px;transition:all .15s;}
.srow:hover{border-color:var(--bdr2);background:rgba(255,255,255,.02);}
.srow.on{border-color:var(--gold);background:var(--gold-bg);}
.badge{background:var(--gold-bg2);color:var(--gold-l);padding:3px 9px;border-radius:11px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge-green{background:rgba(42,122,82,.2);color:var(--green-l);padding:3px 9px;border-radius:11px;font-size:11px;font-weight:700;}
.badge-blue{background:rgba(42,92,170,.2);color:var(--blue-l);padding:3px 9px;border-radius:11px;font-size:11px;font-weight:700;}
.badge-red{background:rgba(184,48,48,.2);color:var(--red-l);padding:3px 9px;border-radius:11px;font-size:11px;font-weight:700;}
.price-bar{background:linear-gradient(135deg,rgba(245,166,35,.1),rgba(245,166,35,.04));border:1px solid rgba(245,166,35,.3);border-radius:var(--rl);padding:14px 18px;margin-bottom:12px;}
.stepper{display:flex;align-items:center;margin-bottom:18px;overflow-x:auto;padding-bottom:4px;gap:0;}
.s-item{display:flex;align-items:center;gap:5px;cursor:pointer;}
.s-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:1.5px solid var(--bdr2);color:var(--txt3);transition:all .2s;flex-shrink:0;}
.s-num.act{background:var(--gold-grd);border:none;color:#fff;box-shadow:0 0 10px rgba(191,136,64,.4);}
.s-num.done{background:var(--green);border:none;color:#fff;}
.s-lbl{font-size:10px;color:var(--txt3);white-space:nowrap;}
.s-lbl.act{color:var(--gold-l);font-weight:700;}
.s-lbl.done{color:var(--green-l);}
.s-line{flex:1;height:1px;background:var(--bdr);margin:0 5px;min-width:10px;}
.s-line.done{background:var(--green);}
.sticky-bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:960px;background:linear-gradient(90deg,#0d1b3e 0%,#152447 100%);border:1px solid rgba(245,166,35,.25);border-radius:var(--rl);padding:11px 16px;backdrop-filter:blur(14px);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;z-index:100;}
.puerta-item{background:var(--bg3);border:1px solid var(--bdr2);border-radius:var(--r);padding:11px 14px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.puerta-num{width:26px;height:26px;border-radius:50%;background:var(--gold-grd);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0;}
.totals-card{background:linear-gradient(135deg,#1a3070 0%,#152660 50%,#0f1e50 100%);border:1px solid rgba(255,255,255,.15);border-radius:var(--rl);padding:18px 20px;}
.total-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.total-final{border-top:1px solid rgba(191,136,64,.28);padding-top:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.big-price{font-family:Space Grotesk;font-size:30px;font-weight:800;color:#FFF;text-shadow:0 0 10px rgba(255,255,255,.9),0 0 25px rgba(255,255,255,.5),0 0 50px rgba(200,220,255,.25);}
.hist-row{background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);border:1px solid var(--bdr);border-radius:var(--r);padding:13px 15px;margin-bottom:8px;cursor:pointer;transition:all .15s;}
.hist-row:hover{border-color:rgba(245,166,35,.3);background:var(--bg4);}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
@media(max-width:700px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
.kpi-card{background:linear-gradient(135deg,var(--bg3) 0%,var(--bg2) 100%);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px 16px;}
.kpi-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin-bottom:5px;}
.kpi-value{font-family:Space Grotesk;font-size:20px;font-weight:800;color:#FFF;text-shadow:0 0 8px rgba(255,255,255,.8),0 0 18px rgba(255,255,255,.3);}
.kpi-sub{font-size:11px;color:var(--txt3);margin-top:3px;}
.chart-wrap{background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px 16px;margin-bottom:12px;}
.chart-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--txt2);margin-bottom:7px;}
.charts-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:680px){.charts-2col{grid-template-columns:1fr;}}
.flete-list{max-height:260px;overflow-y:auto;border:1px solid var(--bdr2);border-radius:var(--r);background:var(--bg3);}
.flete-row{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .12s;}
.flete-row:hover{background:var(--bg4);}
.flete-row.on{background:var(--gold-bg);border-color:rgba(191,136,64,.25);}
.flete-row:last-child{border-bottom:none;}
.grp-title{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--txt2);margin-bottom:8px;text-transform:uppercase;}
.qty-ctrl{display:flex;gap:7px;align-items:center;margin-top:6px;}
.qty-btn{width:32px;height:32px;border-radius:var(--r);background:var(--bg3);border:1px solid var(--bdr2);color:var(--txt);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.qty-btn:hover{border-color:var(--gold);color:var(--gold);}
.qty-inp{width:65px;text-align:center;font-weight:700;}
.warn{padding:10px 14px;border-radius:var(--r);background:rgba(184,48,48,.1);border:1px solid rgba(184,48,48,.3);color:#e08080;font-size:13px;margin-bottom:12px;}
.nota{font-size:11px;color:var(--txt3);line-height:1.8;margin-top:14px;padding-top:12px;border-top:1px solid var(--bdr);}
.ncot-badge{background:var(--gold-bg);border:1px solid rgba(191,136,64,.22);border-radius:6px;padding:4px 11px;font-size:11px;font-weight:700;color:var(--gold-l);font-family:Space Grotesk;}
.empty-state{text-align:center;padding:40px 20px;color:var(--txt3);}
.section-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}

.estado-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700;cursor:pointer;border:none;font-family:inherit;}
.est-enviada{background:rgba(26,78,138,.35);color:#7ab0f5;}
.est-revision{background:rgba(245,158,11,.2);color:#F59E0B;}
.est-aprobada{background:rgba(42,122,82,.2);color:#3DAF76;}
.est-rechazada{background:rgba(184,48,48,.2);color:#E05050;}
.est-produccion{background:rgba(139,92,246,.2);color:#A78BFA;}
.est-pendiente{background:rgba(92,86,80,.2);color:#A09890;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--bg2);border:1px solid var(--bdr2);border-radius:var(--rl);padding:22px;max-width:500px;width:100%;max-height:92vh;overflow-y:auto;}
.modal-title{font-family:Space Grotesk;font-size:17px;font-weight:800;color:#FFF;text-shadow:0 0 8px rgba(255,255,255,.7);margin-bottom:14px;}
.plantilla-item{background:var(--bg3);border:1px solid var(--bdr2);border-radius:var(--r);padding:11px 14px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;transition:all .15s;}
.plantilla-item:hover{border-color:rgba(191,136,64,.4);background:var(--bg4);}
.upload-zone{border:2px dashed var(--bdr2);border-radius:var(--rl);padding:28px;text-align:center;cursor:pointer;transition:all .2s;position:relative;}
.upload-zone:hover{border-color:var(--gold);background:var(--gold-bg);}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.pipeline-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}

@media print{.nav,.hero,.stepper,.sticky-bar,.no-print{display:none!important;}body{background:#fff!important;color:#111!important;}.wrap{padding:10px!important;max-width:100%!important;}.card,.totals-card,.price-bar{border:1px solid #e0d5c0!important;background:#faf8f4!important;break-inside:avoid;}.step-title,.big-price,.kpi-value{text-shadow:none!important;color:#1a1a1a!important;}.badge{background:#fef3c7!important;color:#92400e!important;}}
</style>
</head>

// Cantería recomendada según modelo de puerta
// Cantería según TIPO + MODELO
// Fuente: cuadro validado con Claudio 26/05/2026
// Enchapada (cualquier modelo) → siempre ca5 Normal ($4.303) o ca4 F30/F60 ($6.762)
// MDF/HR Copahue/Lonquimay → ca1 ($2.254) | MDF F30/F60 → ca3 ($5.738)
// MDF Calbuco/Antuco II/Llaima → ca2 ($2.049)
// MDF Antuco/Mara Clara → ca5 ($4.303)
// Enchapada F30/F60 → ca4 ($6.762)
function getCanteria(tipo, modelo){
  var esEnchapada = tipo==="Enchapada";
  var esF30 = tipo==="F30";
  var esF60 = tipo==="F60";
  var esF = esF30||esF60;
  var esMDF = tipo==="MDF"||tipo==="MDF HR"||tipo==="MDF MC"||tipo==="MDF HR MC";

  // ── TIPO ENCHAPADA ──
  if(esEnchapada){
    // Antuco/Mara Clara → ca7 $5.967 (cualquier relleno)
    if(modelo==="Antuco"||modelo==="Mara Clara")
      return {id:"ca7", desc:"Antuco/Mara Clara Enchapada $5.967"};
    // Especial → ca4 $6.762
    if(modelo==="Especial")
      return {id:"ca4", desc:"Enchapadas F30/F60 $6.762"};
    // Copahue/Calbuco/Antuco II → ca5 $4.303
    return {id:"ca5", desc:"Enchapadas Normal $4.303"};
  }

  // ── MDF/HR F30 o F60 con modelo enchapado ──
  if(esF){
    if(modelo==="Antuco"||modelo==="Mara Clara")
      return {id:"ca7", desc:"Antuco/Mara Clara Enchapada $5.967"};
    if(modelo==="Copahue"||modelo==="Lonquimay"||modelo==="Calbuco"||modelo==="Antuco II"||modelo==="Llaima")
      return {id:"ca4", desc:"Enchapadas F30/F60 $6.762"};
    return {id:"ca3", desc:"F30/F60 MDF $5.738"};
  }

  // ── MDF/HR NORMAL ──
  if(esMDF){
    if(modelo==="Antuco"||modelo==="Mara Clara")
      return {id:"ca7", desc:"Antuco/Mara Clara Enchapada $5.967"};
    if(modelo==="Copahue"||modelo==="Lonquimay")
      return {id:"ca1", desc:"Copahue 2V5H $2.254"};
    if(modelo==="Calbuco"||modelo==="Antuco II"||modelo==="Llaima")
      return {id:"ca2", desc:"Calbuco 5H $2.049"};
  }

  return null;
}

// ═══ CÁLCULOS ═══
function pBase(pw){
  if(!pw.tipo||!pw.alto)return 0;
  // Acero: precio ingresado manualmente
  if(pw.tipo==="Acero") return pw.precioAcero||0;
  if(!pw.ancho)return 0;
  var r=null;
  // Medio Cuerpo: usar tabla PP_MC
  if(pw.tipo==="MDF MC"||pw.tipo==="MDF HR MC"){
    r=PP_MC[pw.tipo]&&PP_MC[pw.tipo][+pw.alto]&&PP_MC[pw.tipo][+pw.alto][+pw.ancho]?PP_MC[pw.tipo][+pw.alto][+pw.ancho]:null;
  } else {
    var src=window.PP_CUSTOM||PP;
    r=src[pw.tipo]&&src[pw.tipo][+pw.alto]&&src[pw.tipo][+pw.alto][+pw.ancho]?src[pw.tipo][+pw.alto][+pw.ancho]:null;
  }
  if(!r)return 0;
  var ai=pw.relleno&&pw.relleno.includes("Aislapol");
  var base=(ai&&r[1]!=null)?r[1]:(r[0]||0);
  // Agregar extra Llaima si corresponde
  if(pw.modelo==="Llaima"&&LLAIMA_EXTRA[+pw.ancho])base+=LLAIMA_EXTRA[+pw.ancho];
  // Agregar vidrio (Termo PDA) si es Medio Cuerpo con vidrio
  if((pw.tipo==="MDF MC"||pw.tipo==="MDF HR MC")&&pw.conVidrio===true){
    base+=(+pw.ancho>=800)?MC_VIDRIO.grande:MC_VIDRIO.chico;
  }
  return base;
}
function pMarco(pw){
  if(!pw.tm||!pw.altm||!pw.matm)return 0;
  let t;
  if(pw.tm==="F30")t=MF30;
  else if(pw.tm==="F60")t=MF60;
  else{
    if(!pw.am)return 0;
    // Intentar con categoría exacta primero, luego fallback a 75-90
    t=MS[pw.am];
    if(t&&t[+pw.altm]&&t[+pw.altm][pw.matm])return t[+pw.altm][pw.matm];
    // Fallback a 75-90
    t=MS["75-90"];
  }
  return t?.[+pw.altm]?.[pw.matm]||0;
}
function pBisag(pw){if(!pw.bis)return 0;const b=BISAGRAS.find(x=>x.id===pw.bis);return b?b.p*pw.cbis:0;}
function pServs(pw){
  return(pw.servs||[]).reduce(function(a,id){
    var s=AS.find(function(x){return x.id===id;});
    if(!s)return a;
    if(s.manual){
      var mk="spx_"+id;
      var val=pw[mk]||0;
      var mult=s.mult||1;
      return a+val*mult;
    }
    // Celosías con cantidad editable (multEdit)
    if(s.multEdit){
      var cmk="cmult_"+id;
      return a+s.p*(pw[cmk]||s.mult||1);
    }
    return a+s.p*(s.mult||1);
  },0);
}
function unitPW(pw){
  if(!pw)return 0;
  pw=Object.assign({cant:1,ancho:0,alto:0,relleno:"Carton Honey",modelo:"",precioAcero:0,
    tm:"",am:"",altm:0,matm:"",bis:"",cbis:0,servs:[],conVidrio:false},pw);
  return(pBase(pw)||0)+(pMarco(pw)||0)+(pBisag(pw)||0)+(pServs(pw)||0);
}
function desglosePW(pw){
  if(!pw||!pw.tipo)return{pb:0,ma:0,bi:0,se:0,unit:0,total:0,pbT:0,maT:0,biT:0,seT:0};
  // Normalizar campos faltantes para puertas que vienen de la IA
  pw=Object.assign({cant:1,ancho:0,alto:0,relleno:"Carton Honey",modelo:"",precioAcero:0,
    tm:"",am:"",altm:0,matm:"",bis:"",cbis:0,servs:[],conVidrio:false},pw);
  var cnt=pw.cant||1;
  var pb=pBase(pw)||0, ma=pMarco(pw)||0, bi=pBisag(pw)||0, se=pServs(pw)||0;
  var unit=pb+ma+bi+se;
  return{pb:pb,ma:ma,bi:bi,se:se,unit:unit,total:unit*cnt,pbT:pb*cnt,maT:ma*cnt,biT:bi*cnt,seT:se*cnt};
}
function totPuertas(){return C.puertas.reduce((a,p)=>a+unitPW(p)*p.cant,0);}
function totFlete(){return C.flete?C.flete.monto*C.flete.viajes:0;}
function totales(){const s=totPuertas()+totFlete();const d=s*(C.descuento/100);const sd=s-d;const iv=C.iva?sd*0.19:0;return{s,d,sd,iv,total:sd+iv};}

var RECINTOS_EXTERIOR=["acceso","exterior","logia","terraza"];

function aplicarReglasAuto(){
  var pw=C.pw;
  var rec=pw.recinto;
  var tipo=pw.tipo;

  // REGLA 1: Acceso/Exterior + MDF → forzar MDF HR + Aislapol
  if(RECINTOS_EXTERIOR.indexOf(rec)>-1 && tipo==="MDF"){
    C.pw.tipo="MDF HR";
    C.pw.relleno="Aislapol";
    return "⚠️ Recinto exterior detectado: se cambió a MDF HR + Aislapol automáticamente.";
  }

  // REGLA 2: Acero → Poliuretano
  if(tipo==="Acero"){
    C.pw.relleno="Poliuretano Inyectado";
  }

  return null;
}

function getClientesEmpresasSugeridas(campo, query){
  if(!query||query.length<2)return[];
  var q=query.toLowerCase();
  var items=new Set();
  var historial=JSON.parse(localStorage.getItem("indoor_cots")||"[]");
  historial.forEach(function(c){
    if(c[campo]&&c[campo].toLowerCase().indexOf(q)>-1)items.add(c[campo]);
  });
  return Array.from(items).slice(0,6);
}

function canNext(){
  if(C.paso===1)return datosCompletos()&&!!C.pw.recinto;
  if(C.paso===2)return C.pw.cant>=1;
  if(C.paso===3){
    var pw=C.pw;
    if(!pw.tipo)return false;
    if(pw.tipo!=="Acero"&&MODELOS[pw.tipo]&&MODELOS[pw.tipo].length>1&&!pw.modelo)return false;
    if(!pw.relleno)return false;
    if(pw.tipo==="Acero")return (pw.precioAcero||0)>0;
    if((pw.tipo==="MDF MC"||pw.tipo==="MDF HR MC")&&pw.conVidrio===null)return false;
    return pw.ancho&&pw.alto&&pBase(pw)>0;
  }
  return true;
}
function pasoMsg(){
  if(C.paso!==3)return "";
  var pw=C.pw;
  var esAcero=pw.tipo==="Acero";
  var esMC=pw.tipo==="MDF MC"||pw.tipo==="MDF HR MC";
  var falta=[];
  if(!pw.tipo)falta.push("materialidad");
  else if(!esAcero&&MODELOS[pw.tipo]&&MODELOS[pw.tipo].length>1&&!pw.modelo)falta.push("modelo");
  else if(!pw.relleno)falta.push("relleno");
  else if(esAcero&&!(pw.precioAcero>0))falta.push("precio (ingresa manualmente)");
  else if(esMC&&pw.conVidrio===null)falta.push("indicar si lleva vidrio Termo PDA");
  else if(!esAcero&&!pw.ancho&&!pw.alto)falta.push("ancho y alto");
  else if(!esAcero&&!pw.ancho)falta.push("ancho");
  else if(!esAcero&&!pw.alto)falta.push("alto ← selecciona el alto de la puerta");
  if(!falta.length)return "";
  return '<div style="display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);margin-top:10px;">'

}

function guardarCot(){
  const T=totales();
  const snap={ncot:C.ncot,fecha:C.fecha,fechaISO:new Date().toISOString(),cliente:C.cliente,empresa:C.empresa,fono:C.fono,email:C.email,proyecto:C.proyecto,puertas:JSON.parse(JSON.stringify(C.puertas)),flete:C.flete,descuento:C.descuento,iva:C.iva,totalNeto:T.sd,totalFinal:T.total,mes:mesK(),estado:"enviada",notas:""};
  saveCot(snap);
  alert("Cotizacion "+C.ncot+" guardada correctamente.");

function alertaVencimiento(cot){
  var alertarEn=["enviada","revision","pendiente"];
  var estado=cot.estado||"pendiente";
  if(alertarEn.indexOf(estado)===-1)return "";
  if(!cot.fechaISO)return "";
  var dias=Math.floor((Date.now()-new Date(cot.fechaISO).getTime())/(1000*60*60*24));
  if(dias>=30)return '<span style="background:rgba(184,48,48,.25);color:#ff8080;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;">🔴 VENCIDA ('+dias+'d)</span>';
  if(dias>=25)return '<span style="background:rgba(245,158,11,.2);color:#F59E0B;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;">⚠️ Vence en '+(30-dias)+'d</span>';
  if(dias>=20)return '<span style="background:rgba(191,136,64,.15);color:var(--gold-l);padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;">⏰ '+dias+'d</span>';
  return "";
}

function calcKPIConversion(hist){
  var enviadas=hist.filter(function(c){return ["enviada","revision","aprobada","rechazada"].indexOf(c.estado||"")>-1;}).length;
  var aprobadas=hist.filter(function(c){return c.estado==="aprobada";}).length;
  var rechazadas=hist.filter(function(c){return c.estado==="rechazada";}).length;
  var enCurso=hist.filter(function(c){return c.estado==="revision"||c.estado==="enviada";}).length;
  var tasa=enviadas>0?Math.round(aprobadas/enviadas*100):0;
  return{enviadas:enviadas,aprobadas:aprobadas,rechazadas:rechazadas,enCurso:enCurso,tasa:tasa};
}

function calcComparativoMes(hist){
  var ahora=new Date();
  var mesActual=ahora.getFullYear()+"-"+String(ahora.getMonth()+1).padStart(2,"0");
  var antesMes=new Date(ahora.getFullYear(),ahora.getMonth()-1,1);
  var mesAnterior=antesMes.getFullYear()+"-"+String(antesMes.getMonth()+1).padStart(2,"0");
  var totActual=hist.filter(function(c){return c.mes===mesActual;}).reduce(function(a,c){return a+c.totalFinal;},0);
  var totAnterior=hist.filter(function(c){return c.mes===mesAnterior;}).reduce(function(a,c){return a+c.totalFinal;},0);
  var nActual=hist.filter(function(c){return c.mes===mesActual;}).length;
  var nAnterior=hist.filter(function(c){return c.mes===mesAnterior;}).length;
  var pctMonto=totAnterior>0?Math.round((totActual-totAnterior)/totAnterior*100):null;
  var pctN=nAnterior>0?Math.round((nActual-nAnterior)/nAnterior*100):null;
  return{mesActual:mesActual,mesAnterior:mesAnterior,totActual:totActual,totAnterior:totAnterior,nActual:nActual,nAnterior:nAnterior,pctMonto:pctMonto,pctN:pctN};
}

function deltaBadge(pct){
  if(pct===null)return'<span style="font-size:11px;color:var(--txt3);">sin datos ant.</span>';
  if(pct>0)return'<span style="font-size:12px;font-weight:700;color:#3DAF76;">&#9650; +'+pct+'%</span>';
  if(pct<0)return'<span style="font-size:12px;font-weight:700;color:#E05050;">&#9660; '+pct+'%</span>';
  return'<span style="font-size:12px;color:var(--txt3);">= Sin cambio</span>';
}

  var out='<div class="pipeline-bar">';

    var cnt;

    else{cnt=hist.filter(function(c){return c.estado===est;}).length;}
    if(cnt===0)return;

function calcTotalesCot(cot){
  var s=(cot.puertas||[]).reduce(function(a,p){return a+unitPW(p)*p.cant;},0)
       +(cot.flete?cot.flete.monto*cot.flete.viajes:0);
  var d=s*((cot.descuento||0)/100);
  var sd=s-d;
  var iv=cot.iva?sd*0.19:0;
  return{s:s,d:d,sd:sd,iv:iv,total:sd+iv};
}

function exportXLS(){
  var hist=loadH();
  if(!hist.length){alert("No hay cotizaciones guardadas.");return;}

  // Hoja 1 - Resumen por cotizacion
  var h1="N° Cot\tFecha\tCliente\tEmpresa\tFono\tProyecto\tEstado\tPuertas\tFlete Destino\tDescuento%\tTotal Neto\tTotal Final\n";
  hist.forEach(function(c){

  });

  var h2="N° Cot\tFecha\tCliente\tEmpresa\tProyecto\tRecinto\tTipo Puerta\tRelleno\tAncho\tAlto\tMarco\tMaterial Marco\tBisagras\tServicios\tCantidad\tPrecio Unitario\tSubtotal Puerta\n";
  hist.forEach(function(c){
    (c.puertas||[]).forEach(function(p){
      var rec=RECINTOS.find(function(r){return r.id===p.recinto;});
      var recNom=rec?rec.n:(p.recinto||"");
      var pb=0;
      var ppSrc=window.PP_CUSTOM||PP;
      var pr=ppSrc[p.tipo]&&ppSrc[p.tipo][+p.alto]&&ppSrc[p.tipo][+p.alto][+p.ancho]?ppSrc[p.tipo][+p.alto][+p.ancho]:null;
      if(pr){var ai=p.relleno&&p.relleno.includes("Aislapol");pb=(ai&&pr[1]!=null)?pr[1]:(pr[0]||0);}
      var ma=0;
      if(p.tm&&p.altm&&p.matm){
        var mt;if(p.tm==="F30")mt=MF30;else if(p.tm==="F60")mt=MF60;else if(p.am&&MS[p.am])mt=MS[p.am];
        if(mt&&mt[+p.altm])ma=mt[+p.altm][p.matm]||0;
      }
      var bi=p.bis?((BISAGRAS.find(function(b){return b.id===p.bis;})||{p:0}).p*p.cbis):0;
      var se=(p.servs||[]).reduce(function(a,id){var sv=AS.find(function(x){return x.id===id;});if(!sv)return a;if(sv.manual){return a+(p["spx_"+id]||0)*(sv.mult||1);}if(sv.multEdit){return a+sv.p*(p["cmult_"+id]||sv.mult||1);}return a+sv.p*(sv.mult||1);},0);
      var unit=pb+ma+bi+se;
      var servNoms=(p.servs||[]).map(function(id){var s=AS.find(function(x){return x.id===id;});return s?s.n:"";}).filter(Boolean).join(" | ");
      var marcoDes=(p.tm&&p.tm!="")?((p.tm==="std"?"Estandar":p.tm)+" "+(p.altm||"")+"mm"):"";
      var bisDes=p.bis?((BISAGRAS.find(function(b){return b.id===p.bis;})||{n:""}).n+" x"+p.cbis):"";
      h2+=c.ncot+"\t"+c.fecha+"\t"+(c.cliente||"")+"\t"+(c.empresa||"")+"\t"+(c.proyecto||"")+"\t"
        +recNom+"\t"+p.tipo+"\t"+(p.relleno||"")+"\t"+(p.ancho||"")+"\t"+(p.alto||"")+"\t"
        +marcoDes+"\t"+(p.matm||"")+"\t"+bisDes+"\t"+servNoms+"\t"
        +p.cant+"\t"+Math.round(unit)+"\t"+Math.round(unit*p.cant)+"\n";
    });
    // Fila flete si existe
    if(c.flete){
      h2+=c.ncot+"\t"+c.fecha+"\t"+(c.cliente||"")+"\t"+(c.empresa||"")+"\t"+(c.proyecto||"")+"\t"
        +"FLETE\t"+c.flete.destino+"\t"+c.flete.transportista+"\t\t\t\t\t\t\t"
        +c.flete.viajes+"\t"+Math.round(c.flete.monto)+"\t"+Math.round(c.flete.monto*c.flete.viajes)+"\n";
    }
  });

  // Exportar como 2 hojas usando XLSX si disponible
  if(typeof XLSX!=="undefined"){
    var wb=XLSX.utils.book_new();
    var ws1=XLSX.utils.aoa_to_sheet(h1.trim().split("\n").map(function(r){return r.split("\t");}));
    var ws2=XLSX.utils.aoa_to_sheet(h2.trim().split("\n").map(function(r){return r.split("\t");}));
    // Ancho de columnas
    ws1["!cols"]=[{wch:16},{wch:14},{wch:20},{wch:22},{wch:14},{wch:22},{wch:14},{wch:8},{wch:18},{wch:10},{wch:14},{wch:14}];
    ws2["!cols"]=[{wch:16},{wch:14},{wch:18},{wch:20},{wch:20},{wch:14},{wch:10},{wch:18},{wch:7},{wch:7},{wch:16},{wch:18},{wch:20},{wch:30},{wch:8},{wch:14},{wch:14}];
    XLSX.utils.book_append_sheet(wb,ws1,"Resumen Cotizaciones");
    XLSX.utils.book_append_sheet(wb,ws2,"Detalle Puertas");
    XLSX.writeFile(wb,"InDooR_Cotizaciones_"+mesK()+".xlsx");
  } else {
    // Fallback a TSV si no hay XLSX
    var combined="=== RESUMEN ===\n"+h1+"\n\n=== DETALLE PUERTAS ===\n"+h2;
    var b=new Blob(["\ufeff"+combined],{type:"text/tab-separated-values;charset=utf-8"});
    var a=document.createElement("a");a.href=URL.createObjectURL(b);
    a.download="InDooR_Cotizaciones_"+mesK()+".xls";a.click();
  }
}

// ════════════════════════════════════════════════════
// DASHBOARD UNIFICADO — Lee los 3 sistemas
// ════════════════════════════════════════════════════
function renderHub(){
  // ── Leer datos de los 3 sistemas ──
  var cots_cotizador = JSON.parse(localStorage.getItem("indoor_cots")||"[]");
  var cots_crm       = JSON.parse(localStorage.getItem("indoor_cot_v5")||"[]");
  var nvs_crm        = JSON.parse(localStorage.getItem("indoor_nv_v5")||"[]");
  var cal_data       = JSON.parse(localStorage.getItem("indoor_nuble_2026")||"{}");

  // ── KPIs COTIZADOR ──
  var total_cotizado = cots_cotizador.reduce(function(a,c){return a+(c.totalNeto||0);},0);
  var hoy = new Date();
  var mes_actual = hoy.getFullYear()+"-"+String(hoy.getMonth()+1).padStart(2,"0");
  var cots_mes = cots_cotizador.filter(function(c){return (c.fecha||"").startsWith(mes_actual);});
  var total_mes = cots_mes.reduce(function(a,c){return a+(c.totalNeto||0);},0);

  // ── KPIs CRM ──
  var ganadas  = cots_crm.filter(function(c){return c.est==="ganada";});
  var perdidas = cots_crm.filter(function(c){return c.est==="perdida";});
  var enviadas = cots_crm.filter(function(c){return c.est==="enviada";});
  var total_ganado  = ganadas.reduce(function(a,c){return a+(c.neto||0);},0);
  var total_perdido = perdidas.reduce(function(a,c){return a+(c.neto||0);},0);
  var total_nv = nvs_crm.reduce(function(a,n){return a+(n.neto||0);},0);

  // ── KPIs CALENDARIO ──
  var n_visitadas=0, n_cotizando=0, n_pendientes=0, n_ov=0;
  Object.keys(cal_data).forEach(function(id){
    var e = cal_data[id].e||"PENDIENTE";
    if(e==="VISITADA")n_visitadas++;
    else if(e==="COTIZANDO")n_cotizando++;
    else if(e==="PENDIENTE")n_pendientes++;
    else if(e==="OTRO_VENDEDOR")n_ov++;
  });

  // Cotizaciones recientes del cotizador (top 6)
  var recientes = cots_cotizador.slice().sort(function(a,b){
    return (b.fecha||"").localeCompare(a.fecha||"");
  }).slice(0,6);

  // Obras en COTIZANDO del calendario
  var obras_cotizando = Object.keys(cal_data).filter(function(id){
    return (cal_data[id].e||"") === "COTIZANDO";
  });

  var h = '<div class="section-hdr"><div class="step-title" style="font-size:18px;">📊 Dashboard Unificado InDooR</div><div style="font-size:11px;color:var(--txt3);margin-top:3px;">Datos en tiempo real de tus 3 sistemas · '+new Date().toLocaleDateString("es-CL",{day:"numeric",month:"long",year:"numeric"})+'</div></div>';

  // ══ FILA 1 — KPIs principales ══
  var kpis = [
    {ico:"📋", lbl:"Cotizado total", val:fmt(total_cotizado), sub:cots_cotizador.length+" cotizaciones", col:"#378ADD"},
    {ico:"✅", lbl:"Ganado (CRM)", val:fmt(total_ganado), sub:ganadas.length+" ganadas", col:"#22c55e"},
    {ico:"📤", lbl:"En seguimiento", val:fmt(enviadas.reduce(function(a,c){return a+(c.neto||0);},0)), sub:enviadas.length+" enviadas", col:"#F5A623"},
    {ico:"❌", lbl:"Perdido (CRM)", val:fmt(total_perdido), sub:perdidas.length+" perdidas", col:"#ef4444"},
    {ico:"📑", lbl:"Notas de Venta", val:fmt(total_nv), sub:nvs_crm.length+" NV emitidas", col:"#a78bfa"},
    {ico:"🗓", lbl:"Cotizado este mes", val:fmt(total_mes), sub:cots_mes.length+" este mes", col:"#4A9ED6"},
  ];

  h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;">';
  kpis.forEach(function(k){
    h += '<div class="card" style="padding:12px;border-left:3px solid '+k.col+';border-radius:0 var(--r) var(--r) 0;">';
    h += '<div style="font-size:18px;margin-bottom:4px;">'+k.ico+'</div>';
    h += '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);">'+k.lbl+'</div>';
    h += '<div style="font-size:20px;font-weight:700;color:'+k.col+';margin:4px 0;">'+k.val+'</div>';
    h += '<div style="font-size:11px;color:var(--txt3);">'+k.sub+'</div>';
    h += '</div>';
  });
  h += '</div>';

  // ══ FILA 2 — Obras calendario + cotizaciones recientes ══
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">';

  // Obras activas del calendario
  h += '<div class="card" style="padding:12px;">';
  h += '<div style="font-size:12px;font-weight:700;color:var(--txt);margin-bottom:10px;">🏗 Estado obras — Calendario Ñuble/Maule</div>';
  
  var cal_stats = [
    {lbl:"Visitadas",    n:n_visitadas,  col:"#22c55e"},
    {lbl:"Cotizando",    n:n_cotizando,  col:"#F5A623"},
    {lbl:"Pendientes",   n:n_pendientes, col:"var(--txt3)"},
    {lbl:"Otro vendedor",n:n_ov,         col:"#ef4444"},
  ];
  var total_obras = n_visitadas+n_cotizando+n_pendientes+n_ov;

  cal_stats.forEach(function(cs){
    var pct = total_obras > 0 ? Math.round((cs.n/total_obras)*100) : 0;
    h += '<div style="margin-bottom:8px;">';
    h += '<div style="display:flex;justify-content:space-between;margin-bottom:3px;">';
    h += '<span style="font-size:12px;color:var(--txt2);">'+cs.lbl+'</span>';
    h += '<span style="font-size:12px;font-weight:700;color:'+cs.col+';">'+cs.n+' ('+pct+'%)</span>';
    h += '</div>';
    h += '<div style="height:5px;background:var(--bg3);border-radius:3px;">';
    h += '<div style="height:100%;width:'+pct+'%;background:'+cs.col+';border-radius:3px;"></div>';
    h += '</div></div>';
  });

  if(obras_cotizando.length > 0){
    h += '<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--bdr);">';
    h += '<div style="font-size:11px;font-weight:700;color:var(--gold);margin-bottom:5px;">⚡ Obras en cotización activa</div>';
    obras_cotizando.slice(0,4).forEach(function(id){
      var nota = cal_data[id].n || "";
      h += '<div style="font-size:11px;color:var(--txt2);padding:3px 0;border-bottom:1px solid var(--bdr);">📍 '+id+(nota?' — <span style="color:var(--txt3)">'+nota.substring(0,40)+'</span>':'')+'</div>';
    });
    h += '</div>';
  }
  h += '</div>';

  // Cotizaciones recientes del cotizador
  h += '<div class="card" style="padding:12px;">';
  h += '<div style="font-size:12px;font-weight:700;color:var(--txt);margin-bottom:10px;">📋 Últimas cotizaciones emitidas</div>';

  if(recientes.length === 0){
    h += '<div style="font-size:12px;color:var(--txt3);text-align:center;padding:20px;">Sin cotizaciones aún.<br>Usa el Cotizador para crear una.</div>';
  } else {
    recientes.forEach(function(c){
      var fecha = c.fecha ? c.fecha.split("T")[0] : "—";
      h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bdr);">';
      h += '<div style="flex:1;min-width:0;">';
      h += '<div style="font-size:12px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+(c.cliente||"Sin nombre")+'</div>';
      h += '<div style="font-size:10px;color:var(--txt3);">'+(c.empresa||"")+(c.ncot?" · "+c.ncot:"")+'</div>';
      h += '</div>';
      h += '<div style="text-align:right;flex-shrink:0;margin-left:8px;">';
      h += '<div style="font-size:12px;font-weight:700;color:var(--gold-l);">'+fmt(c.totalNeto||0)+'</div>';
      h += '<div style="font-size:10px;color:var(--txt3);">'+fecha+'</div>';
      h += '</div></div>';
    });
  }

  h += '<div style="margin-top:8px;text-align:center;">';
  h += '<button class="btn btn-sm" onclick="setTab(\"historial\",document.getElementById(\"tab-historial\"))" style="font-size:11px;padding:5px 12px;">Ver historial completo \u2192</button>';
  h += '</div>';
  h += '</div>';
  h += '</div>'; // end grid fila 2

  // ══ FILA 3 — CRM top clientes + tasa cierre ══
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">';

  // Top clientes CRM por monto ganado
  h += '<div class="card" style="padding:12px;">';
  h += '<div style="font-size:12px;font-weight:700;color:var(--txt);margin-bottom:10px;">🏆 Top clientes — CRM (ganadas)</div>';

  if(ganadas.length === 0){
    h += '<div style="font-size:12px;color:var(--txt3);text-align:center;padding:15px;">Sin datos en CRM aún</div>';
  } else {
    var por_cliente = {};
    ganadas.forEach(function(c){
      var k = c.cli||"Sin nombre";
      if(!por_cliente[k]) por_cliente[k]={monto:0,n:0};
      por_cliente[k].monto += c.neto||0;
      por_cliente[k].n++;
    });
    var top = Object.keys(por_cliente).map(function(k){
      return {cli:k, monto:por_cliente[k].monto, n:por_cliente[k].n};
    }).sort(function(a,b){return b.monto-a.monto;}).slice(0,5);
    
    var max_m = top[0]?top[0].monto:1;
    top.forEach(function(t,i){
      var pct = Math.round((t.monto/max_m)*100);
      h += '<div style="margin-bottom:7px;">';
      h += '<div style="display:flex;justify-content:space-between;margin-bottom:2px;">';
      h += '<span style="font-size:11px;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;">'+t.cli+'</span>';
      h += '<span style="font-size:11px;font-weight:700;color:var(--gold);">'+fmt(t.monto)+'</span>';
      h += '</div>';
      h += '<div style="height:4px;background:var(--bg3);border-radius:2px;">';
      h += '<div style="height:100%;width:'+pct+'%;background:var(--gold);border-radius:2px;"></div>';
      h += '</div></div>';
    });
  }
  h += '</div>';

  // Tasa de cierre + pipeline
  h += '<div class="card" style="padding:12px;">';
  h += '<div style="font-size:12px;font-weight:700;color:var(--txt);margin-bottom:10px;">📈 Pipeline CRM</div>';

  var total_cots_crm = cots_crm.length;
  var tasa = total_cots_crm > 0 ? Math.round((ganadas.length/total_cots_crm)*100) : 0;

  var pipeline = [
    {lbl:"Total cotizaciones",n:total_cots_crm,   col:"var(--blue-l)"},
    {lbl:"Enviadas",          n:enviadas.length,   col:"#F5A623"},
    {lbl:"Ganadas",           n:ganadas.length,    col:"#22c55e"},
    {lbl:"Perdidas",          n:perdidas.length,   col:"#ef4444"},
  ];
  pipeline.forEach(function(p){
    h += '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bdr);">';
    h += '<span style="font-size:12px;color:var(--txt2);">'+p.lbl+'</span>';
    h += '<span style="font-size:13px;font-weight:700;color:'+p.col+';">'+p.n+'</span>';
    h += '</div>';
  });

  h += '<div style="margin-top:10px;text-align:center;padding:10px;background:var(--bg2);border-radius:var(--r);">';
  h += '<div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);">Tasa de cierre</div>';
  h += '<div style="font-size:28px;font-weight:700;color:'+(tasa>=40?'#22c55e':tasa>=20?'#F5A623':'#ef4444')+';">'+tasa+'%</div>';
  h += '</div>';

    h += '<div class="card" style="text-align:center;padding:40px;">';
    h += '<div style="font-size:40px;margin-bottom:12px;">📊</div>';
    h += '<div style="font-size:15px;font-weight:700;color:var(--txt);margin-bottom:8px;">Sin datos aún</div>';

    h += '</div>';
    return h;
  }

  h += '</div>';
  h += '</div>'; // end grid fila 3

  return h;

// CALCULADORA COMPARATIVA — InDooR vs Competencia RM
// ════════════════════════════════════════════════════
var CALC = {
  destino: "",
  cantidad: 100,
  precio_indoor: 25000,
  precio_comp: 25000,
  transportista: "RBM",
  busq: ""
};

function renderCalculadora(){
  var f = FLETES.find(function(x){return x.d===CALC.destino;});
  var flete_indoor = f ? (CALC.transportista==="RBM"?f.rbm:CALC.transportista==="ALV"?f.alv:f.ind) : 0;
  var flete_rm = f ? f.rbm : 0; // Competencia RM siempre usa RBM aprox

  var total_indoor = (CALC.precio_indoor * CALC.cantidad) + flete_indoor;
  var total_comp   = (CALC.precio_comp   * CALC.cantidad) + flete_rm;
  var ahorro = total_comp - total_indoor;
  var pct_ahorro = total_comp > 0 ? ((ahorro/total_comp)*100).toFixed(1) : 0;

  var filtrados = FLETES.filter(function(x){
    return x.d.toLowerCase().includes((CALC.busq||"").toLowerCase());
  });

  var h = '<div class="section-hdr"><div class="step-title" style="font-size:18px;">🚛 Calculadora Comparativa — InDooR vs Competencia RM</div></div>';

  // ── INPUTS ──
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">';

  // Col 1 — Destino
  h += '<div class="card" style="padding:12px;">';
  h += '<div class="label">📍 Destino de obra</div>';
  h += '<input placeholder="🔍 Buscar ciudad..." value="'+(CALC.busq||"")+'" style="margin-bottom:8px;width:100%;"'+
       ' id="calc-busq" oninput="CALC.busq=this.value;renderApp()">';
  h += '<div style="max-height:160px;overflow-y:auto;border:1px solid var(--bdr2);border-radius:var(--r);">';
  filtrados.slice(0,20).forEach(function(dest){
    var on = dest.d === CALC.destino;
    var pi = CALC.transportista==="RBM"?dest.rbm:CALC.transportista==="ALV"?dest.alv:dest.ind;
    h += '<div data-dest="'+dest.d+'" class="calc-dest-row" '+'style="padding:7px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--bdr);background:'+(on?'rgba(245,166,35,.12)':'')+';">'+'<span style="color:'+(on?'var(--gold)':'var(--txt)')+';font-weight:'+(on?'700':'400')+';">'+dest.d+'</span>'+'<span style="float:right;color:var(--txt3);font-size:11px;">RBM '+fmt(dest.rbm)+'</span></div>';
         'style="padding:7px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--bdr);'+
         'background:'+(on?'rgba(245,166,35,.12)':'')+';">'+
         '<span style="color:'+(on?'var(--gold)':'var(--txt)')+';font-weight:'+(on?'700':'400')+';">'+dest.d+'</span>'+
         '<span style="float:right;color:var(--txt3);font-size:11px;">RBM '+fmt(dest.rbm)+'</span>'+
         '</div>';
  });
  h += '</div></div>';

  // Col 2 — Parámetros
  h += '<div class="card" style="padding:12px;">';
  h += '<div class="label">📦 Cantidad de puertas</div>';
  h += '<input type="number" min="1" value="'+CALC.cantidad+'" id="calc-qty" style="width:100%;margin-bottom:10px;" '+
       'oninput="CALC.cantidad=parseInt(this.value)||1;calcUpdate()">';
  
  h += '<div class="label" style="margin-top:6px;">💰 Precio unitario InDooR (neto)</div>';
  h += '<input type="number" min="0" step="500" value="'+CALC.precio_indoor+'" id="calc-p1" style="width:100%;margin-bottom:10px;" '+
       'oninput="CALC.precio_indoor=parseInt(this.value)||0;calcUpdate()">';
  
  h += '<div class="label" style="margin-top:6px;">💰 Precio unitario Competencia (neto)</div>';
  h += '<input type="number" min="0" step="500" value="'+CALC.precio_comp+'" id="calc-p2" style="width:100%;margin-bottom:10px;" '+
       'oninput="CALC.precio_comp=parseInt(this.value)||0;calcUpdate()">';

  h += '<div class="label" style="margin-top:6px;">🚛 Transportista InDooR</div>';
  h += '<div style="display:flex;gap:6px;">';
  [["RBM","RBM"],["ALV","Álvarez"],["IND","InDooR"]].forEach(function(t){
    var on = CALC.transportista===t[0];
    h += '<button data-transp="'+t[0]+'" class="calc-transp chip '+(on?'on':'')+'">'+t[1]+'</button>';
  });
  h += '</div></div>';
  h += '</div>'; // end grid

  // ── RESULTADO ──
  h += '<div id="calc-results">'+calcResultsHTML()+'</div>';
  if(false){
  } else {
    h += '<div class="card" style="text-align:center;padding:30px;color:var(--txt3);">👆 Selecciona un destino para ver el comparativo</div>';
  }

  return h;
}

var _calcTimer = null;
function calcUpdate(){
  // Debounce 300ms — no re-render while typing
  clearTimeout(_calcTimer);
  _calcTimer = setTimeout(function(){
    // Only update results section, preserve input focus
    var resDiv = document.getElementById("calc-results");
    if(resDiv){
      resDiv.innerHTML = calcResultsHTML();
    }
  }, 300);
}

function calcResultsHTML(){
  var f = FLETES.find(function(x){return x.d===CALC.destino;});
  var flete_indoor = f?(CALC.transportista==="RBM"?f.rbm:CALC.transportista==="ALV"?f.alv:f.ind):0;
  var flete_rm = f?f.rbm:0;
  var total_indoor = (CALC.precio_indoor*CALC.cantidad)+flete_indoor;
  var total_comp   = (CALC.precio_comp  *CALC.cantidad)+flete_rm;
  var ahorro = total_comp - total_indoor;
  var pct_ahorro = total_comp>0?((ahorro/total_comp)*100).toFixed(1):0;

  if(!CALC.destino) return '<div class="card" style="text-align:center;padding:30px;color:var(--txt3);">👆 Selecciona un destino para ver el comparativo</div>';

  var indoor_wins = total_indoor <= total_comp;
  var h = '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;">';

  h += '<div class="card" style="padding:14px;border:2px solid '+(indoor_wins?'var(--gold)':'var(--bdr2)')+';text-align:center;">';
  h += '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--blue-l);margin-bottom:6px;">InDooR SpA</div>';
  h += '<div style="font-size:11px;color:var(--txt3);">'+CALC.cantidad+' puertas × '+fmt(CALC.precio_indoor)+'</div>';
  h += '<div style="font-size:11px;color:var(--txt3);">+ Flete '+fmt(flete_indoor)+'</div>';
  h += '<div style="font-size:20px;font-weight:700;color:'+(indoor_wins?'var(--gold)':'var(--txt)')+';margin-top:8px;">'+fmt(total_indoor)+'</div>';
  if(indoor_wins) h += '<div style="font-size:11px;color:var(--gold);margin-top:4px;">✅ Mejor precio</div>';
  h += '</div>';

  h += '<div class="card" style="padding:14px;text-align:center;">';
  h += '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--txt2);margin-bottom:6px;">Competencia RM</div>';
  h += '<div style="font-size:11px;color:var(--txt3);">'+CALC.cantidad+' puertas × '+fmt(CALC.precio_comp)+'</div>';
  h += '<div style="font-size:11px;color:var(--txt3);">+ Flete RM '+fmt(flete_rm)+'</div>';
  h += '<div style="font-size:20px;font-weight:700;color:var(--txt);margin-top:8px;">'+fmt(total_comp)+'</div>';
  h += '</div>';

  var ahorroColor = ahorro>=0?'#22c55e':'#ef4444';
  h += '<div class="card" style="padding:14px;text-align:center;background:'+(ahorro>=0?'rgba(34,197,94,.08)':'rgba(239,68,68,.08)')+';border-color:'+(ahorro>=0?'rgba(34,197,94,.3)':'rgba(239,68,68,.3)')+';">';
  h += '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:'+ahorroColor+';margin-bottom:6px;">'+(ahorro>=0?'Ahorro cliente':'Diferencia')+'</div>';
  h += '<div style="font-size:28px;font-weight:700;color:'+ahorroColor+';margin-top:8px;">'+(ahorro>=0?'+':'')+fmt(Math.abs(ahorro))+'</div>';
  h += '<div style="font-size:13px;color:'+ahorroColor+';margin-top:4px;">'+(ahorro>=0?pct_ahorro+'% menos con InDooR':Math.abs(pct_ahorro)+'% más caro')+'</div>';
  h += '</div>';
  h += '</div>';

  h += '<div class="card" style="padding:14px;">';
  h += '<div class="label" style="margin-bottom:10px;">📊 Desglose — '+CALC.destino+' — '+CALC.cantidad+' puertas</div>';
  h += '<table style="width:100%;font-size:12px;border-collapse:collapse;">';
  h += '<thead><tr style="border-bottom:2px solid var(--bdr2);">';
  ['Concepto','InDooR SpA','Competencia RM','Diferencia'].forEach(function(c,i){
    h += '<th style="padding:7px 8px;text-align:'+(i===0?'left':'right')+';color:var(--txt2);font-weight:700;">'+c+'</th>';
  });
  h += '</tr></thead><tbody>';

  var rows=[
    ['Precio unitario',CALC.precio_indoor,CALC.precio_comp],
    ['Subtotal puertas',CALC.precio_indoor*CALC.cantidad,CALC.precio_comp*CALC.cantidad],
    ['Flete a '+CALC.destino,flete_indoor,flete_rm],
    ['TOTAL PUESTO EN OBRA',total_indoor,total_comp],
  ];
  rows.forEach(function(r,ri){
    var diff=r[2]-r[1];
    var isBold=ri===rows.length-1;
    var bg=ri===rows.length-1?'background:rgba(245,166,35,.06);':ri%2===0?'':'background:var(--bg2);';
    h += '<tr style="'+bg+'border-bottom:1px solid var(--bdr);">';
    h += '<td style="padding:7px 8px;font-weight:'+(isBold?'700':'400')+';color:var(--txt);">'+r[0]+'</td>';
    h += '<td style="padding:7px 8px;text-align:right;font-weight:'+(isBold?'700':'400')+';color:'+(isBold?'var(--gold)':'var(--txt)')+';">'+fmt(r[1])+'</td>';
    h += '<td style="padding:7px 8px;text-align:right;font-weight:'+(isBold?'700':'400')+';color:var(--txt);">'+fmt(r[2])+'</td>';
    h += '<td style="padding:7px 8px;text-align:right;font-weight:'+(isBold?'700':'400')+';color:'+(diff>0?'#22c55e':diff<0?'#ef4444':'var(--txt3)')+';">'+(diff>=0?'+':'')+fmt(diff)+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table>';

  if(ahorro>0){
    var arg_flete=fmt(flete_rm-flete_indoor);
    h += '<div style="margin-top:12px;padding:10px 14px;border-radius:var(--r);background:rgba(245,166,35,.08);border-left:3px solid var(--gold);">';
    h += '<div style="font-size:11px;font-weight:700;color:var(--gold);margin-bottom:4px;">💬 Argumento para la visita</div>';
    h += '<div style="font-size:12px;color:var(--txt2);">&ldquo;Un proveedor de Santiago cobra '+fmt(flete_rm)+' de flete a '+CALC.destino+'. Con InDooR pagas '+fmt(flete_indoor)+'. Son '+arg_flete+' de ahorro en flete. Total: <strong>'+fmt(ahorro)+'</strong> que te quedas en el proyecto.&rdquo;</div>';
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function initCalculadora(){
  document.querySelectorAll(".calc-dest-row").forEach(function(el){
    el.addEventListener("click",function(){
      CALC.destino=el.dataset.dest;
      CALC.busq=el.dataset.dest;
      // Update search input without full re-render
      var inp=document.querySelector("#calc-busq");
      if(inp)inp.value=el.dataset.dest;
      var resDiv=document.getElementById("calc-results");
      if(resDiv)resDiv.innerHTML=calcResultsHTML();
      else renderApp();
    });
  });
  document.querySelectorAll(".calc-transp").forEach(function(el){
    el.addEventListener("click",function(){
      CALC.transportista=el.dataset.transp;
      // Update chip states
      document.querySelectorAll(".calc-transp").forEach(function(b){
        b.classList.toggle("on",b.dataset.transp===CALC.transportista);
      });
      var resDiv=document.getElementById("calc-results");
      if(resDiv)resDiv.innerHTML=calcResultsHTML();
      else renderApp();
    });
  });
}

function svgPuerta(tipo, color, w, h){
  var c=color||"#c87830";
  var cL=color==="lite"?"#e0e8f8":"rgba(255,255,255,0.15)";
  var stroke=color==="lite"?"#aabbd0":"rgba(0,0,0,0.25)";

  // Base door shape
  var s='<rect x="4" y="2" width="'+w+'" height="'+h+'" rx="1" fill="'+c+'" stroke="'+stroke+'" stroke-width="1"/>';
  // Door knob
  s+='<circle cx="'+Math.round(w*0.78)+'" cy="'+Math.round(h*0.52)+'" r="2" fill="rgba(0,0,0,0.25)"/>';

  var mw=w, mh=h;

  if(tipo==="lisa"||tipo==="lisa_m")return s;

  // Lines helpers
  var lc="rgba(0,0,0,0.18)";
  var lw=mw-8;
  var x0=8;

  if(tipo==="5h"||tipo==="5h_w"||tipo==="5h_m"){
    [0.2,0.35,0.5,0.65,0.8].forEach(function(r){
      s+='<line x1="'+x0+'" y1="'+Math.round(mh*r)+'" x2="'+Math.round(x0+lw)+'" y2="'+Math.round(mh*r)+'" stroke="'+lc+'" stroke-width="1.5"/>';
    });
  }
  if(tipo==="2v"||tipo==="2v_w"){
    [0.3,0.7].forEach(function(r){
      s+='<line x1="'+Math.round(mw*r+4)+'" y1="6" x2="'+Math.round(mw*r+4)+'" y2="'+Math.round(mh-4)+'" stroke="'+lc+'" stroke-width="1.5"/>';
    });
  }
  if(tipo==="2v5h"||tipo==="2v5h_w"){
    [0.3,0.7].forEach(function(r){
      s+='<line x1="'+Math.round(mw*r+4)+'" y1="6" x2="'+Math.round(mw*r+4)+'" y2="'+Math.round(mh-4)+'" stroke="'+lc+'" stroke-width="1.5"/>';
    });
    [0.2,0.35,0.5,0.65,0.8].forEach(function(r){
      s+='<line x1="'+x0+'" y1="'+Math.round(mh*r)+'" x2="'+Math.round(x0+lw)+'" y2="'+Math.round(mh*r)+'" stroke="'+lc+'" stroke-width="1.5"/>';
    });
  }
  if(tipo==="1v5h"||tipo==="1v5h_w"){
    s+='<line x1="'+Math.round(mw*0.5+4)+'" y1="6" x2="'+Math.round(mw*0.5+4)+'" y2="'+Math.round(mh-4)+'" stroke="'+lc+'" stroke-width="1.5"/>';
    [0.2,0.35,0.5,0.65,0.8].forEach(function(r){
      s+='<line x1="'+x0+'" y1="'+Math.round(mh*r)+'" x2="'+Math.round(x0+lw)+'" y2="'+Math.round(mh*r)+'" stroke="'+lc+'" stroke-width="1.5"/>';
    });
  }
  if(tipo==="1luz"||tipo==="1luz_w"||tipo==="1luz_m"){
    s+='<rect x="8" y="8" width="'+Math.round(lw)+'" height="'+Math.round(mh*0.35)+'" rx="1" fill="rgba(180,220,255,0.5)" stroke="'+lc+'" stroke-width="0.8"/>';
  }
  if(tipo==="4luz_w"||tipo==="5luz"){
    var lh2=Math.round((mh-16)/5);
    for(var i=0;i<(tipo==="5luz"?5:4);i++){
      s+='<rect x="8" y="'+Math.round(6+i*(lh2+3))+'" width="'+Math.round(lw)+'" height="'+lh2+'" rx="1" fill="rgba(180,220,255,0.5)" stroke="'+lc+'" stroke-width="0.8"/>';
    }
  }
  if(tipo==="9luz_w"||tipo==="9luz_m"){
    var gw=Math.round(lw/3)-2, gh=Math.round(mh*0.6/3)-2;
    for(var r=0;r<3;r++){for(var c2=0;c2<3;c2++){
      s+='<rect x="'+Math.round(x0+c2*(gw+2))+'" y="'+Math.round(6+r*(gh+2))+'" width="'+gw+'" height="'+gh+'" rx="1" fill="rgba(180,220,255,0.5)" stroke="'+lc+'" stroke-width="0.8"/>';
    }}
  }
  if(tipo==="6pan_m"||tipo==="2pan_w"||tipo==="2pan_m"){
    var panels=(tipo==="6pan_m")?6:2;
    var ph=Math.round((mh-16)/(panels/2))-4;
    var pw2=Math.round(lw/2)-3;
    for(var p=0;p<panels;p++){
      var px=Math.round(x0+(p%2)*(pw2+4)), py=Math.round(6+Math.floor(p/2)*(ph+4));
      s+='<rect x="'+px+'" y="'+py+'" width="'+pw2+'" height="'+ph+'" rx="1" fill="rgba(0,0,0,0.08)" stroke="'+lc+'" stroke-width="0.8"/>';
    }
  }
  if(tipo==="f30"||tipo==="f30e"||tipo==="f60"||tipo==="f60e"){
    // Fire door indicator
    s+='<rect x="4" y="2" width="'+w+'" height="4" fill="rgba(200,50,30,0.4)"/>';
    if(tipo==="f30e"||tipo==="f60e"){
      [0.3,0.7].forEach(function(r){
        s+='<line x1="'+Math.round(mw*r+4)+'" y1="6" x2="'+Math.round(mw*r+4)+'" y2="'+Math.round(mh-4)+'" stroke="'+lc+'" stroke-width="1.5"/>';
      });
      [0.2,0.4,0.6,0.8].forEach(function(r){
        s+='<line x1="'+x0+'" y1="'+Math.round(mh*r)+'" x2="'+Math.round(x0+lw)+'" y2="'+Math.round(mh*r)+'" stroke="'+lc+'" stroke-width="1.5"/>';
      });
    }
  }
  return s;
}

async function interpretarConIA(){
  if(!AI.input.trim())return;
  // Auto-detectar si pegaron una API key
  var inputLimpio=AI.input.trim().split("\r").join("").split("\n").join("").split("\t").join("").split(" ").join("");
  if(inputLimpio.startsWith("sk-ant-")){
    window.INDOOR_API_KEY=inputLimpio;
    try{localStorage.setItem("indoor_api_key",inputLimpio);}catch(e){}
    try{sessionStorage.setItem("indoor_api_key",inputLimpio);}catch(e){}
    AI.input="";
    alert("API Key guardada. Ahora ingresa los requerimientos del cliente y vuelve a hacer clic en Interpretar.");
    renderApp();
    return;
  }
  if(!window.INDOOR_API_KEY){
    var k=localStorage.getItem("indoor_api_key")||sessionStorage.getItem("indoor_api_key")||"";
    if(!k){alert("Primero pega tu API Key en el campo y presiona Interpretar para guardarla.");return;}
    window.INDOOR_API_KEY=k;
  }
  AI.loading=true;AI.error="";AI.resultado=null;
  renderApp();

  // Construir prompt con toda la info de precios InDooR
  var preciosRef = construirRefPrecios();

  // Preprocesar texto — asociar líneas JUEGO MARCO a su puerta
  var textoRaw = AI.input || "";
  // Detectar líneas de marco y asociarlas explícitamente
  // Fusionar JUEGO MARCO con la puerta del mismo bloque
  // Dividir en bloques por puerta — cada línea con PUERTA inicia nuevo bloque
  var lineas = textoRaw.split("\n").map(function(l){return l.trim();}).filter(Boolean);
  var bloques = [];
  var bloqueActual = [];
  for(var li=0; li<lineas.length; li++){
    var l = lineas[li];
    var idxP = l.toUpperCase().indexOf("PUERTA");
    // esPuerta: contiene la palabra PUERTA y DESPUÉS de ella no hay JUEGO/MARCO/BISAGRA/PRECOLGADO
    var esPuerta = idxP > -1 && !/JUEGO|MARCO|BISAGRA|PRECOLGADO/i.test(l.slice(idxP));
    if(esPuerta){
      if(bloqueActual.length > 0) bloques.push(bloqueActual);
      bloqueActual = [l];
    } else {
      bloqueActual.push(l);
    }
  }
  if(bloqueActual.length > 0) bloques.push(bloqueActual);

  // Fusionar JUEGO MARCO con la línea de puerta de su bloque
  var textoEnriquecido = bloques.map(function(bloque){
    var puerta = bloque[0];
    var resto = bloque.slice(1);
    var marcosBloque = resto.filter(function(l){ return /JUEGO.*MARCO|MARCO.*PINO|MARCO.*LENGA/i.test(l); });
    var otrosItems = resto.filter(function(l){ return !/JUEGO.*MARCO|MARCO.*PINO|MARCO.*LENGA/i.test(l); });
    if(marcosBloque.length > 0){
      puerta = puerta + " [MARCO: " + marcosBloque.join("; ") + "]";
    }
    return [puerta].concat(otrosItems).join("\n");
  }).join("\n\n");
  AI.input = textoEnriquecido;

  var prompt = "Eres cotizador de puertas InDooR SpA Chile. Responde SOLO JSON valido.\n\n"
  + "RELLENOS: HONEY->Carton Honey | AISLAPOL/AGLOMERADO->Aislapol | F30 AGLOMERADO->F30 Aglomerado | F60 AGLOMERADO->F60 Aglomerado | POLIURETANO->Poliuretano Inyectado\n"
  + "TIPOS: MDF HR->MDF HR | F60/CORTAFUEGO F60->F60 | F30->F30 | ENCHAPADA->Enchapada | METALICA/ACERO->Acero | MDF->MDF\n"
  + "ALTOS: si no existe->usar inmediato SUPERIOR (2220->2400, 2075->2100). 2300 es valido ahora\n"
  + "MEDIO CUERPO: 1/2 CPO,1/2 CURPO,LOGIA->modelo Lisa 1/2 Cuerpo S/Vidrio, servIds incluye ex15\n"
  + "MARCOS: JUEGO MARCO/TIRA MARCO->asignar a esa puerta. 30x70->60-70 | 30x90/38x90/40x90->75-90. NATIVO/LENGA->F60($53580). CON REBAJE->Pino Desnudo+Rebaje($12920).\n"
  + "PRECIOS MARCO 75-90: Desnudo 2100=$11842,5200=$11316,5400=$12921 | Prepintado 2100=$13579,5200=$13580,5400=$14211\n"
  + "PRECIOS MARCO 60-70: Desnudo 2100=$8474,2200=$8895 | Prepintado 2100=$10184,2200=$10658\n"
  + "MARCO F30: Prepintado 5400=$18974 | MARCO F60/NATIVO: Desnudo 5200=$53580,5400=$58450\n"

      alert("Error API: HTTP " + response.status + "\n" + JSON.stringify(data).substring(0,300));

      alert("Error IA: " + JSON.stringify(data.error).substring(0,300));
      throw new Error("IA error: " + data.error.message);
    }
    var texto=(data.content||[]).map(function(b){return b.text||"";}).join("");
    texto=texto.replace(/```json|```/g,"").trim();
    // Extraer solo el bloque JSON
    var jm=texto.indexOf('{')>-1?texto.slice(texto.indexOf('{'),texto.lastIndexOf('}')+1):texto;
    if(jm) texto=jm;
    // Limpiar trailing commas que causan errores
    texto=texto.replace(/,(\s*[}\]])/g,"$1");
    var parsed;
    try{
      parsed=JSON.parse(texto);
    }catch(parseErr){
      try{
        var s2=texto.indexOf("{"),e2=texto.lastIndexOf("}");
        if(s2>-1&&e2>s2) parsed=JSON.parse(texto.slice(s2,e2+1));
        else throw parseErr;
      }catch(e3){
        throw new Error("JSON error: " + parseErr.message + " | Texto: " + texto.substring(0,200));
      }
    }
    if(!parsed||!parsed.puertas)throw new Error("Respuesta IA sin campo puertas");

    // Enriquecer con precios reales del sistema
    AI.resultado=(parsed.puertas||[]).map(function(p){
      return enriquecerPuerta(p);
    }).filter(function(x){return x!==null;});
    AI.notas=parsed.notas||"";
    AI.loading=false;

  }catch(e){
    AI.error="Error al interpretar: "+e.message+". Revisa la descripción e intenta nuevamente.";
    AI.loading=false;
  }
  renderApp();
}

function enriquecerPuerta(p){
  if(!p||typeof p!=="object")return null;
  p=Object.assign({},p); // defensive copy
  // Recalcular precio con datos reales del sistema
  var pw={
    tipo:p.tipo||"MDF",
    modelo:p.modelo||"",
    relleno:p.relleno||"Carton Honey",
    ancho:p.ancho||0,
    alto:p.alto||0,
    precioAcero:0,
    conVidrio:false,
    cant:p.cant||1,
    tm:(p.marcoTipo||"") || (p.marcoAlto>0?"std":""),
    am:(function(){
      var a=p.marcoAncho||"";
      // Si viene como número → mapear a categoría
      if(a&&!a.includes("-")){
        var n=parseInt(a)||0;
        if(n<=70) a="60-70";
        else if(n<=90) a="75-90";
        else a="100-115";
      }
      if(!a) a="75-90"; // default
      return a;
    })(),
    altm:parseInt(p.marcoAlto)||0,
    matm:p.marcoMat||"",
    // Bisagras SOLO si el prompt las incluyó explícitamente
    bis:p.bisagraId||"",
    cbis:(function(){
      if(!p.bisagraId) return 0;
      if(p.cantBisagras && p.cant && p.cantBisagras > p.cant){
        // cantBisagras is total - divide by cant to get per door
        return Math.round(p.cantBisagras / (p.cant||1));
      }
      return p.cantBisagras || (p.tipo==="F60"?4:3);
    })(),
    servs:p.servIds||[],
    bastidor:p.bastidor||false,
    chapero:p.chapero||null,
    "cmult_ex1":p["cmult_ex1"]||p.cmult_ex1||1,
    "cmult_ex10":p["cmult_ex10"]||p.cmult_ex10||1,
    "cmult_ex11":p["cmult_ex11"]||p.cmult_ex11||1,
    "cmult_ex12":p["cmult_ex12"]||p.cmult_ex12||1,
    "cmult_ex13":p["cmult_ex13"]||p.cmult_ex13||1,
    "cmult_ex14":p["cmult_ex14"]||p.cmult_ex14||1
  };

  // Normalizar alto al más cercano disponible
  // Normalizar al más cercano SUPERIOR (no inferior) si no existe
  var altosDisp=[2000,2100,2200,2300,2400];
  var altoCercano;
  // Si el alto exacto no existe, buscar el inmediato superior
  if(altosDisp.indexOf(pw.alto)===-1){
    altoCercano=altosDisp.find(function(a){return a>pw.alto;})||2400;
  } else {
    altoCercano=pw.alto;
  }
  if(pw.alto>0&&altoCercano!==pw.alto){
    p.alerta=(p.alerta?p.alerta+". ":"")+"Alto normalizado de "+pw.alto+"mm a "+altoCercano+"mm";
    pw.alto=altoCercano;p.alto=altoCercano;
  }

  var precioReal=unitPW(pw);
  // CORRECCIÓN CANTERÍA — forzar regla getCanteria() en código
  // Si la IA devolvió una cantería incorrecta para Enchapada, corregirla
  if(pw.tipo==="Enchapada"&&pw.modelo&&pw.servs){
    var cantCorrecta=getCanteria(pw.tipo,pw.modelo);
    if(cantCorrecta){
      // Eliminar cualquier cantería incorrecta (ca1,ca2,ca3)
      var CANT_MDF=["ca1","ca2","ca3"];
      pw.servs=pw.servs.filter(function(id){return CANT_MDF.indexOf(id)===-1;});
      // Si tenía una cantería MDF, reemplazar por la correcta Enchapada
      var teniaCanteria=p.servIds&&(p.servIds.indexOf("ca1")>-1||p.servIds.indexOf("ca2")>-1||p.servIds.indexOf("ca3")>-1||p.servIds.indexOf("ca4")>-1||p.servIds.indexOf("ca5")>-1||p.servIds.indexOf("ca7")>-1);
      if(teniaCanteria&&pw.servs.indexOf(cantCorrecta.id)===-1){
        pw.servs.push(cantCorrecta.id);
      }
    }
  }

  // Puerta Acero sin precio manual → asumir 70000
  if(pw.tipo==="Acero"&&(!pw.precioAcero||pw.precioAcero===0)){
    pw.precioAcero=70000;
    precioReal=pBase(pw)+pMarco(pw)+pBisag(pw)+pServs(pw);
    p.alerta=(p.alerta?p.alerta+" | ":"")+"⚠️ Precio puerta Acero asumido $70.000 (minimo $65.000). Verificar.";
  }

  // FILTRO DE SERVICIOS — aplicar siempre independiente de lo que devuelva la IA
  // ex7=Barredera: NUNCA automático
  // ex6=Burlete: NUNCA automático  
  // ex2=Doble Bastidor: NUNCA automático
  // ex1=Doble Cabezal: NUNCA automático
  var SERVICIOS_NUNCA_AUTO=["ex7","ex8","ex9","ex6","ex2"];  // ex1 permitido cuando cliente lo pide
  var servIdsFiltrados=(pw.servs||[]).filter(function(id){
    return SERVICIOS_NUNCA_AUTO.indexOf(id)===-1;
  });
  pw.servs=servIdsFiltrados;

  return {
    recinto:p.recinto||"Sin recinto",
    tipo:pw.tipo,
    modelo:pw.modelo,
    ancho:pw.ancho,
    alto:pw.alto,
    relleno:pw.relleno,
    prepintada:p.prepintada||false,
    cant:pw.cant,
    marcoDesc:p.marcoDesc||"",
    servicios:p.servicios||[],
    precioUnit:precioReal>0?precioReal:(p.precioUnit||0),
    alerta:p.alerta||null,
    _pw:pw
  };
}

function procesarExcelPrecios(ev){
  var file=ev.target.files[0];
  if(!file)return;
  if(typeof XLSX==="undefined"){alert("Librería Excel no cargada. Verifica conexión.");return;}
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:"array"});
      var newPP={MDF:{},"MDF HR":{},F30:{},F60:{},Enchapada:{}};
      var registros=0;
      var sheetNames=wb.SheetNames;
      var hojasMDF=sheetNames.filter(function(n){return n.match(/pintura|mdf|puerta/i);});
      var hojasF30=sheetNames.filter(function(n){return n.match(/f30|cortafuego 30/i);});
      var hojasF60=sheetNames.filter(function(n){return n.match(/f60|cortafuego 60/i);});
      var hojasEnch=sheetNames.filter(function(n){return n.match(/enchap|mara/i);});
      function leerHoja(sheetName,tipo){
        if(!sheetName||!wb.Sheets[sheetName])return;
        var data=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:null});
        data.forEach(function(row){
          if(!row||row.length<3)return;
          var alto=parseInt(row[0]);
          if(![2000,2100,2200,2400].includes(alto))return;
          if(!newPP[tipo][alto])newPP[tipo][alto]={};
          ANCHOS.forEach(function(ancho,ai){
            var val=row[ai+1];
            if(val&&!isNaN(parseFloat(val))){
              var precio=parseFloat(val);
              if(precio>1000){
                var ex=PP[tipo]&&PP[tipo][alto]&&PP[tipo][alto][ancho];
                newPP[tipo][alto][ancho]=[precio,ex&&ex[1]?ex[1]:null];
                registros++;
              }
            }
          });
        });
      }
      if(hojasMDF.length)leerHoja(hojasMDF[0],"MDF");
      if(hojasF30.length)leerHoja(hojasF30[0],"F30");
      if(hojasF60.length)leerHoja(hojasF60[0],"F60");
      if(hojasEnch.length)leerHoja(hojasEnch[0],"Enchapada");
      if(registros===0){alert("No se encontraron precios. Hojas: "+sheetNames.join(", "));return;}
      Object.keys(PP).forEach(function(tipo){if(!Object.keys(newPP[tipo]).length)newPP[tipo]=JSON.parse(JSON.stringify(PP[tipo]));});
      var custom={fecha:hoy(),registros:registros,pp:newPP,archivo:file.name};
      localStorage.setItem("indoor_precios_custom",JSON.stringify(custom));
      window.PP_CUSTOM=newPP;
      alert("✅ "+registros+" precios cargados · "+file.name);
      renderApp();
    }catch(err){alert("Error al leer Excel: "+err.message);}
  };
  reader.readAsArrayBuffer(file);
}

function abrirModal(content){
  cerrarModal();
  var wrap=document.createElement("div");
  wrap.id="modal-container";
  wrap.innerHTML="<div class='modal-bg' id='modal-bg'><div class='modal'>"+content+"</div></div>";
  wrap.querySelector("#modal-bg").addEventListener("click",function(e){if(e.target.id==="modal-bg")cerrarModal();});
  document.body.appendChild(wrap);
}


function loadPlt(){try{return JSON.parse(localStorage.getItem(LS_PLT)||"[]");}catch{return[];}}
function savePlt(p){localStorage.setItem(LS_PLT,JSON.stringify(p));}

function guardarPlantilla(){
  if(!C.puertas.length){alert("No hay puertas en la cotizacion para guardar como plantilla.");return;}
  var nombre=prompt("Nombre para esta plantilla (ej: Baño estándar, Acceso proyecto tipo):");
  if(!nombre)return;
  var plts=loadPlt();
  plts.unshift({id:Date.now(),nombre:nombre,puertas:JSON.parse(JSON.stringify(C.puertas)),fecha:hoy()});
  savePlt(plts);
  alert("✅ Plantilla '"+nombre+"' guardada. Disponible en el paso 1 del cotizador.");
}

function aplicarPlantilla(id){
  var plt=loadPlt().find(function(p){return p.id===id;});
  if(!plt)return;
  if(!confirm("¿Agregar las "+plt.puertas.length+" puertas de la plantilla '"+plt.nombre+"' a la cotizacion actual?"))return;
  plt.puertas.forEach(function(p){C.puertas.push(JSON.parse(JSON.stringify(p)));});
  cerrarModal();
  C.paso=7;
  renderApp();
}

function borrarPlantilla(id){
  if(!confirm("¿Eliminar esta plantilla?"))return;
  savePlt(loadPlt().filter(function(p){return p.id!==id;}));
  cerrarModal();
  modalPlantillas();
}

function borrarPlantilla(id){
  if(!confirm("¿Eliminar esta plantilla?"))return;
  savePlt(loadPlt().filter(function(p){return p.id!==id;}));
  cerrarModal();
  modalPlantillas();
}

  // ── DETALLE POR RECINTO ──

    // Puerta base
    rect(WHITE,M-2,y-3.5,W-2*(M-2),5.5,true);
    doc.setDrawColor(LINECOLOR[0],LINECOLOR[1],LINECOLOR[2]);doc.setLineWidth(0.15);
    doc.line(M-2,y+2,W-M+2,y+2);

    doc.setTextColor(DGRAY[0],DGRAY[1],DGRAY[2]);
    doc.text(money(dsg.pbT),cols[4],y,{align:"right"});
    y+=5.5;

    // Marco
    if(dsg.ma>0){
      rect(OFFWHITE,M-2,y-3.5,W-2*(M-2),5.5,true);
      doc.setDrawColor(LINECOLOR[0],LINECOLOR[1],LINECOLOR[2]);doc.setLineWidth(0.15);

  // ── PIE DE PÁGINA — azul marino ──

  }catch(pdfErr){
    console.error("PDF error:",pdfErr);
    alert("Error al generar PDF: "+pdfErr.message+". Revisa la consola para más detalles.");
  }
}

</script>
