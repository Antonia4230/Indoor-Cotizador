<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap');
:root{
  --bg:#0d1b3e;--bg2:#152447;--bg3:#1c2e58;--bg4:#243568;
  --bdr:rgba(255,255,255,0.08);--bdr2:rgba(255,255,255,0.15);
  --gold:#F5A623;--gold-d:#d4891a;--gold-l:#F5A623;--gold-xl:#ffc04a;
  --gold-bg:rgba(245,166,35,0.10);--gold-bg2:rgba(245,166,35,0.18);
  --gold-grd:linear-gradient(135deg,#f7b84a 0%,#F5A623 50%,#d4891a 100%);
  --txt:#ffffff;--txt2:#c0d0f0;--txt3:#7a90bb;
  --green:#1a6e30;--green-l:#3DAF76;
  --red:#c0392b;--red-l:#ff8080;
  --blue:#1a4e8a;--blue-l:#7ab0f5;
  --r:8px;--rl:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI','Inter',sans-serif;background:var(--bg);min-height:100vh;color:var(--txt);font-size:14px;line-height:1.5;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg2);}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px;}
.nav{position:sticky;top:0;z-index:300;background:linear-gradient(90deg,#0d1b3e 0%,#152447 100%);border-bottom:2px solid var(--gold);backdrop-filter:blur(16px);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:58px;flex-wrap:wrap;}
.nav-logo{display:flex;align-items:center;gap:11px;}
.nav-logo img{height:32px;filter:brightness(1.1);}
.nav-logo-fb{font-family:Space Grotesk;font-weight:800;font-size:20px;display:none;}
.nav-logo-fb .i{color:var(--gold-l);}.nav-logo-fb .d{color:var(--txt);}.nav-logo-fb .o{color:var(--txt2);}
.nav-sub{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);border-left:1px solid var(--bdr2);padding-left:11px;line-height:1.3;}
.nav-tabs{display:flex;gap:4px;}
.nav-tab{padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;color:#c0d0f0;border:none;background:transparent;font-family:inherit;transition:all .15s;white-space:nowrap;}
.nav-tab:hover{color:var(--gold-l);background:var(--gold-bg);}
.nav-tab.on{background:rgba(245,166,35,.18);color:var(--gold-xl);border:1px solid rgba(245,166,35,.35);}
.nav-right{display:flex;gap:8px;align-items:center;}
.hero{background:linear-gradient(135deg,#0d1b3e 0%,#1a2f6a 50%,#1e3580 100%);border-bottom:2px solid var(--gold);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.hero-left{min-width:150px;}
.hero-exec-lbl{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);margin-bottom:3px;}
.hero-exec{font-family:Space Grotesk;font-size:15px;font-weight:800;color:#FFF;text-shadow:0 0 8px rgba(255,255,255,.9),0 0 20px rgba(255,255,255,.4);}
.hero-exec-co{font-size:10px;color:var(--gold);font-weight:500;margin-top:2px;}
.hero-center{flex:1;text-align:center;padding:0 12px;}
.hero-eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
.hero-title{font-family:Space Grotesk;font-size:24px;font-weight:800;letter-spacing:-.03em;color:#FFF;text-shadow:0 0 10px rgba(255,255,255,.95),0 0 25px rgba(255,255,255,.55),0 0 50px rgba(200,220,255,.3);}
.hero-badge{display:flex;align-items:center;gap:7px;justify-content:center;margin-top:5px;flex-wrap:wrap;}
.hero-badge span{font-size:9px;font-weight:600;letter-spacing:.06em;color:var(--txt3);text-transform:uppercase;}
.hero-badge .dot{width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:.5;}
.hero-right{min-width:120px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.hero-right img{height:36px;filter:brightness(1.1);}
.wrap{max-width:960px;margin:0 auto;padding:22px 18px 100px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--r);font-weight:600;cursor:pointer;font-size:13px;border:none;font-family:inherit;transition:all .18s;white-space:nowrap;}
.btn-p{background:var(--gold-grd);color:#ffffff;box-shadow:0 2px 10px rgba(245,166,35,.25);}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(191,136,64,.4);}
.btn-p:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-g{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);color:#ffffff;}
.btn-g:hover{border-color:var(--gold);color:var(--gold-xl);}
.btn-red{background:rgba(184,48,48,.15);border:1px solid rgba(184,48,48,.3);color:var(--red-l);}
.btn-green{background:rgba(42,122,82,.2);border:1px solid rgba(42,122,82,.35);color:var(--green-l);}
.btn-sm{padding:6px 12px;font-size:12px;}
.card{background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);border:1px solid var(--bdr);border-radius:var(--rl);padding:16px 18px;margin-bottom:12px;transition:border-color .2s;}
.card:hover{border-color:var(--bdr2);}
.step-title{font-family:Space Grotesk;font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:3px;color:#FFF;text-shadow:0 0 8px rgba(255,255,255,.9),0 0 20px rgba(255,255,255,.5),0 0 40px rgba(200,220,255,.25);}
.step-sub{font-size:12px;color:var(--txt3);margin-bottom:14px;}
.label{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin-bottom:7px;}
input,select{width:100%;background:var(--bg4);border:1px solid rgba(255,255,255,.12);color:#ffffff;padding:9px 12px;border-radius:var(--r);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;}
input:focus,select:focus{border-color:var(--gold);}
select option{background:var(--bg3);}
input[type=number]{-moz-appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr 1fr;}}
@media(max-width:380px){.g2,.g3,.g4{grid-template-columns:1fr;}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:20px;border:1.5px solid rgba(255,255,255,.09);cursor:pointer;font-size:12px;font-weight:500;background:transparent;color:var(--txt2);transition:all .15s;font-family:inherit;}
.chip:hover{border-color:var(--gold-l);color:var(--gold-l);}
.chip.on{border-color:var(--gold);background:var(--gold-bg2);color:var(--gold-xl);}
.srow{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:var(--r);border:1px solid var(--bg3);cursor:pointer;margin-bottom:5px;transition:all .15s;}
.srow:hover{border-color:var(--bdr2);background:rgba(255,255,255,.02);}
.srow.on{border-color:var(--gold);background:var(--gold-bg);}
.badge{background:var(--gold-bg2);color:var(--gold-l);padding:3px 9px;border-radius:11px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge-green{background:rgba(42,122,82,.2);color:var(--green-l);padding:3px 9px;border-radius:11px;font-size:11px;font-weight:700;}
.badge-blue{background:rgba(42,92,170,.2);color:var(--blue-l);padding:3px 9px;border-radius:11px;font-size:11px;font-weight:700;}
.badge-red{background:rgba(184,48,48,.2);color:var(--red-l);padding:3px 9px;border-radius:11px;font-size:11px;font-weight:700;}
.price-bar{background:linear-gradient(135deg,rgba(245,166,35,.1),rgba(245,166,35,.04));border:1px solid rgba(245,166,35,.3);border-radius:var(--rl);padding:14px 18px;margin-bottom:12px;}
.stepper{display:flex;align-items:center;margin-bottom:18px;overflow-x:auto;padding-bottom:4px;gap:0;}
.s-item{display:flex;align-items:center;gap:5px;cursor:pointer;}
.s-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:1.5px solid var(--bdr2);color:var(--txt3);transition:all .2s;flex-shrink:0;}
.s-num.act{background:var(--gold-grd);border:none;color:#fff;box-shadow:0 0 10px rgba(191,136,64,.4);}
.s-num.done{background:var(--green);border:none;color:#fff;}
.s-lbl{font-size:10px;color:var(--txt3);white-space:nowrap;}
.s-lbl.act{color:var(--gold-l);font-weight:700;}
.s-lbl.done{color:var(--green-l);}
.s-line{flex:1;height:1px;background:var(--bdr);margin:0 5px;min-width:10px;}
.s-line.done{background:var(--green);}
.sticky-bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:960px;background:linear-gradient(90deg,#0d1b3e 0%,#152447 100%);border:1px solid rgba(245,166,35,.25);border-radius:var(--rl);padding:11px 16px;backdrop-filter:blur(14px);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;z-index:100;}
.puerta-item{background:var(--bg3);border:1px solid var(--bdr2);border-radius:var(--r);padding:11px 14px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.puerta-num{width:26px;height:26px;border-radius:50%;background:var(--gold-grd);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0;}
.totals-card{background:linear-gradient(135deg,#1a3070 0%,#152660 50%,#0f1e50 100%);border:1px solid rgba(255,255,255,.15);border-radius:var(--rl);padding:18px 20px;}
.total-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.total-final{border-top:1px solid rgba(191,136,64,.28);padding-top:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.big-price{font-family:Space Grotesk;font-size:30px;font-weight:800;color:#FFF;text-shadow:0 0 10px rgba(255,255,255,.9),0 0 25px rgba(255,255,255,.5),0 0 50px rgba(200,220,255,.25);}
.hist-row{background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);border:1px solid var(--bdr);border-radius:var(--r);padding:13px 15px;margin-bottom:8px;cursor:pointer;transition:all .15s;}
.hist-row:hover{border-color:rgba(245,166,35,.3);background:var(--bg4);}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
@media(max-width:700px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
.kpi-card{background:linear-gradient(135deg,var(--bg3) 0%,var(--bg2) 100%);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px 16px;}
.kpi-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin-bottom:5px;}
.kpi-value{font-family:Space Grotesk;font-size:20px;font-weight:800;color:#FFF;text-shadow:0 0 8px rgba(255,255,255,.8),0 0 18px rgba(255,255,255,.3);}
.kpi-sub{font-size:11px;color:var(--txt3);margin-top:3px;}
.chart-wrap{background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px 16px;margin-bottom:12px;}
.chart-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--txt2);margin-bottom:7px;}
.charts-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:680px){.charts-2col{grid-template-columns:1fr;}}
.flete-list{max-height:260px;overflow-y:auto;border:1px solid var(--bdr2);border-radius:var(--r);background:var(--bg3);}
.flete-row{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .12s;}
.flete-row:hover{background:var(--bg4);}
.flete-row.on{background:var(--gold-bg);border-color:rgba(191,136,64,.25);}
.flete-row:last-child{border-bottom:none;}
.grp-title{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--txt2);margin-bottom:8px;text-transform:uppercase;}
.qty-ctrl{display:flex;gap:7px;align-items:center;margin-top:6px;}
.qty-btn{width:32px;height:32px;border-radius:var(--r);background:var(--bg3);border:1px solid var(--bdr2);color:var(--txt);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.qty-btn:hover{border-color:var(--gold);color:var(--gold);}
.qty-inp{width:65px;text-align:center;font-weight:700;}
.warn{padding:10px 14px;border-radius:var(--r);background:rgba(184,48,48,.1);border:1px solid rgba(184,48,48,.3);color:#e08080;font-size:13px;margin-bottom:12px;}
.nota{font-size:11px;color:var(--txt3);line-height:1.8;margin-top:14px;padding-top:12px;border-top:1px solid var(--bdr);}
.ncot-badge{background:var(--gold-bg);border:1px solid rgba(191,136,64,.22);border-radius:6px;padding:4px 11px;font-size:11px;font-weight:700;color:var(--gold-l);font-family:Space Grotesk;}
.empty-state{text-align:center;padding:40px 20px;color:var(--txt3);}
.section-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}

.estado-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700;cursor:pointer;border:none;font-family:inherit;}
.est-enviada{background:rgba(26,78,138,.35);color:#7ab0f5;}
.est-revision{background:rgba(245,158,11,.2);color:#F59E0B;}
.est-aprobada{background:rgba(42,122,82,.2);color:#3DAF76;}
.est-rechazada{background:rgba(184,48,48,.2);color:#E05050;}
.est-produccion{background:rgba(139,92,246,.2);color:#A78BFA;}
.est-pendiente{background:rgba(92,86,80,.2);color:#A09890;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--bg2);border:1px solid var(--bdr2);border-radius:var(--rl);padding:22px;max-width:500px;width:100%;max-height:92vh;overflow-y:auto;}
.modal-title{font-family:Space Grotesk;font-size:17px;font-weight:800;color:#FFF;text-shadow:0 0 8px rgba(255,255,255,.7);margin-bottom:14px;}
.plantilla-item{background:var(--bg3);border:1px solid var(--bdr2);border-radius:var(--r);padding:11px 14px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;transition:all .15s;}
.plantilla-item:hover{border-color:rgba(191,136,64,.4);background:var(--bg4);}
.upload-zone{border:2px dashed var(--bdr2);border-radius:var(--rl);padding:28px;text-align:center;cursor:pointer;transition:all .2s;position:relative;}
.upload-zone:hover{border-color:var(--gold);background:var(--gold-bg);}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.pipeline-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}

@media print{.nav,.hero,.stepper,.sticky-bar,.no-print{display:none!important;}body{background:#fff!important;color:#111!important;}.wrap{padding:10px!important;max-width:100%!important;}.card,.totals-card,.price-bar{border:1px solid #e0d5c0!important;background:#faf8f4!important;break-inside:avoid;}.step-title,.big-price,.kpi-value{text-shadow:none!important;color:#1a1a1a!important;}.badge{background:#fef3c7!important;color:#92400e!important;}}
</style>
</head>

// Cantería recomendada según modelo de puerta
// Cantería según TIPO + MODELO
// Fuente: cuadro validado con Claudio 26/05/2026
// Enchapada (cualquier modelo) → siempre ca5 Normal ($4.303) o ca4 F30/F60 ($6.762)
// MDF/HR Copahue/Lonquimay → ca1 ($2.254) | MDF F30/F60 → ca3 ($5.738)
// MDF Calbuco/Antuco II/Llaima → ca2 ($2.049)
// MDF Antuco/Mara Clara → ca5 ($4.303)
// Enchapada F30/F60 → ca4 ($6.762)
function getCanteria(tipo, modelo){
  var esEnchapada = tipo==="Enchapada";
  var esF30 = tipo==="F30";
  var esF60 = tipo==="F60";
  var esF = esF30||esF60;
  var esMDF = tipo==="MDF"||tipo==="MDF HR"||tipo==="MDF MC"||tipo==="MDF HR MC";

  // ── TIPO ENCHAPADA ──
  if(esEnchapada){
    // Antuco/Mara Clara → ca7 $5.967 (cualquier relleno)
    if(modelo==="Antuco"||modelo==="Mara Clara")
      return {id:"ca7", desc:"Antuco/Mara Clara Enchapada $5.967"};
    // Especial → ca4 $6.762
    if(modelo==="Especial")
      return {id:"ca4", desc:"Enchapadas F30/F60 $6.762"};
    // Copahue/Calbuco/Antuco II → ca5 $4.303
    return {id:"ca5", desc:"Enchapadas Normal $4.303"};
  }

  // ── MDF/HR F30 o F60 con modelo enchapado ──
  if(esF){
    if(modelo==="Antuco"||modelo==="Mara Clara")
      return {id:"ca7", desc:"Antuco/Mara Clara Enchapada $5.967"};
    if(modelo==="Copahue"||modelo==="Lonquimay"||modelo==="Calbuco"||modelo==="Antuco II"||modelo==="Llaima")
      return {id:"ca4", desc:"Enchapadas F30/F60 $6.762"};
    return {id:"ca3", desc:"F30/F60 MDF $5.738"};
  }

  // ── MDF/HR NORMAL ──
  if(esMDF){
    if(modelo==="Antuco"||modelo==="Mara Clara")
      return {id:"ca7", desc:"Antuco/Mara Clara Enchapada $5.967"};
    if(modelo==="Copahue"||modelo==="Lonquimay")
      return {id:"ca1", desc:"Copahue 2V5H $2.254"};
    if(modelo==="Calbuco"||modelo==="Antuco II"||modelo==="Llaima")
      return {id:"ca2", desc:"Calbuco 5H $2.049"};
  }

  return null;
}

  // Medio Cuerpo: usar tabla PP_MC
  if(pw.tipo==="MDF MC"||pw.tipo==="MDF HR MC"){
    r=PP_MC[pw.tipo]&&PP_MC[pw.tipo][+pw.alto]&&PP_MC[pw.tipo][+pw.alto][+pw.ancho]?PP_MC[pw.tipo][+pw.alto][+pw.ancho]:null;
  } else {
    var src=window.PP_CUSTOM||PP;
    r=src[pw.tipo]&&src[pw.tipo][+pw.alto]&&src[pw.tipo][+pw.alto][+pw.ancho]?src[pw.tipo][+pw.alto][+pw.ancho]:null;
  }
  if(!r)return 0;
  var ai=pw.relleno&&pw.relleno.includes("Aislapol");
  var base=(ai&&r[1]!=null)?r[1]:(r[0]||0);
  // Agregar extra Llaima si corresponde
  if(pw.modelo==="Llaima"&&LLAIMA_EXTRA[+pw.ancho])base+=LLAIMA_EXTRA[+pw.ancho];
  // Agregar vidrio (Termo PDA) si es Medio Cuerpo con vidrio
  if((pw.tipo==="MDF MC"||pw.tipo==="MDF HR MC")&&pw.conVidrio===true){
    base+=(+pw.ancho>=800)?MC_VIDRIO.grande:MC_VIDRIO.chico;
  }
  return base;
}
function pMarco(pw){if(!pw.tm||!pw.altm||!pw.matm)return 0;let t;if(pw.tm==="F30")t=MF30;else if(pw.tm==="F60")t=MF60;else{if(!pw.am)return 0;t=MS[pw.am];}return t?.[+pw.altm]?.[pw.matm]||0;}
function pBisag(pw){if(!pw.bis)return 0;const b=BISAGRAS.find(x=>x.id===pw.bis);return b?b.p*pw.cbis:0;}
function pServs(pw){
  return(pw.servs||[]).reduce(function(a,id){
    var s=AS.find(function(x){return x.id===id;});
    if(!s)return a;
    if(s.manual){
      var mk="spx_"+id;
      var val=pw[mk]||0;
      // Cinta intumescente: mult define cuántas unidades por puerta (ej: 6 tiras)
      var mult=s.mult||1;
      return a+val*mult;
    }
    return a+s.p;
  },0);
}
function unitPW(pw){return pBase(pw)+pMarco(pw)+pBisag(pw)+pServs(pw);}
function desglosePW(pw){
  if(!pw||!pw.tipo)return{pb:0,ma:0,bi:0,se:0,unit:0,total:0,pbT:0,maT:0,biT:0,seT:0};
  var cnt=pw.cant||1;
  var pb=pBase(pw)||0, ma=pMarco(pw)||0, bi=pBisag(pw)||0, se=pServs(pw)||0;
  var unit=pb+ma+bi+se;
  return{pb:pb,ma:ma,bi:bi,se:se,unit:unit,total:unit*cnt,pbT:pb*cnt,maT:ma*cnt,biT:bi*cnt,seT:se*cnt};
}
function totPuertas(){return C.puertas.reduce((a,p)=>a+unitPW(p)*p.cant,0);}
function totFlete(){return C.flete?C.flete.monto*C.flete.viajes:0;}
function totales(){const s=totPuertas()+totFlete();const d=s*(C.descuento/100);const sd=s-d;const iv=C.iva?sd*0.19:0;return{s,d,sd,iv,total:sd+iv};}
// ══════════════════════════════════════════
// REGLAS AUTOMÁTICAS POR TIPO Y RECINTO
// ══════════════════════════════════════════
var RECINTOS_EXTERIOR=["acceso","exterior","logia","terraza"];
var RECINTOS_COCINA=["cocina","interior"]; // cocina mapeada a interior

function aplicarReglasAuto(){
  var pw=C.pw;
  var rec=pw.recinto;
  var tipo=pw.tipo;

  // REGLA 1: Acceso/Exterior + MDF → forzar MDF HR + Aislapol
  if(RECINTOS_EXTERIOR.indexOf(rec)>-1 && tipo==="MDF"){
    C.pw.tipo="MDF HR";
    C.pw.relleno="Aislapol";
    return "⚠️ Recinto exterior detectado: se cambió a MDF HR + Aislapol automáticamente.";
  }

  // REGLA 2: F30 → bisagra b1 Cromo Satín 3.5×3.5 × 4 + cinta obligatoria
  if(tipo==="F30"){
    C.pw.bis="b1"; C.pw.cbis=4;
    if(!C.pw.servs)C.pw.servs=[];
    if(C.pw.servs.indexOf("fi1")===-1)C.pw.servs.push("fi1");
  }

  // REGLA 3: F60 → bisagra b3 Italinea Acero Inox 3.5×3.5 × 4 + cinta obligatoria
  if(tipo==="F60"){
    C.pw.bis="b3"; C.pw.cbis=4;
    if(!C.pw.servs)C.pw.servs=[];
    if(C.pw.servs.indexOf("fi1")===-1)C.pw.servs.push("fi1");
  }

  // REGLA 4: Acero → Poliuretano
  if(tipo==="Acero"){
    C.pw.relleno="Poliuretano Inyectado";
  }

  return null;
}

function canNext(){
  if(C.paso===1)return datosCompletos()&&!!C.pw.recinto;
  if(C.paso===2)return C.pw.cant>=1;
  if(C.paso===3){
    var pw=C.pw;
    if(!pw.tipo)return false;
    if(pw.tipo!=="Acero"&&MODELOS[pw.tipo]&&MODELOS[pw.tipo].length>1&&!pw.modelo)return false;
    if(!pw.relleno)return false;
    if(pw.tipo==="Acero")return (pw.precioAcero||0)>0;
    if((pw.tipo==="MDF MC"||pw.tipo==="MDF HR MC")&&pw.conVidrio===null)return false;
    return pw.ancho&&pw.alto&&pBase(pw)>0;
  }
  return true;
}
function pasoMsg(){
  if(C.paso!==3)return "";
  var pw=C.pw;
  var esAcero=pw.tipo==="Acero";
  var esMC=pw.tipo==="MDF MC"||pw.tipo==="MDF HR MC";
  var falta=[];
  if(!pw.tipo)falta.push("materialidad");
  else if(!esAcero&&MODELOS[pw.tipo]&&MODELOS[pw.tipo].length>1&&!pw.modelo)falta.push("modelo");
  else if(!pw.relleno)falta.push("relleno");
  else if(esAcero&&!(pw.precioAcero>0))falta.push("precio (ingresa manualmente)");
  else if(esMC&&pw.conVidrio===null)falta.push("indicar si lleva vidrio Termo PDA");
  else if(!esAcero&&!pw.ancho&&!pw.alto)falta.push("ancho y alto");
  else if(!esAcero&&!pw.ancho)falta.push("ancho");
  else if(!esAcero&&!pw.alto)falta.push("alto ← selecciona el alto de la puerta");
  if(!falta.length)return "";
  return '<div style="display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);margin-top:10px;">'
    +'<span style="font-size:14px;">👆</span>'
    +'<span style="font-size:12px;color:#F59E0B;">Falta seleccionar: <strong>'+falta.join(", ")+'</strong> para continuar</span>'
    +'</div>';
}

// ═══ TABS ═══
function setTab(t,el){TAB=t;document.querySelectorAll(".nav-tab").forEach(b=>b.classList.remove("on"));el.classList.add("on");renderApp();}

// ═══ RENDER ═══
function renderApp(){
  document.getElementById("nav-ncot").textContent=C.ncot;
  const app=document.getElementById("app");
  if(TAB==="cotizador")app.innerHTML=C.resumen?renderResumen():renderCotizador();
  else if(TAB==="historial")app.innerHTML=renderHistorial();
  else if(TAB==="precios"){app.innerHTML=renderPrecios();}
  else if(TAB==="asistente"){app.innerHTML=renderAsistente();setTimeout(initAsistente,100);}
  else{app.innerHTML=renderDashboard();setTimeout(initCharts,100);}
}

// ═══ COTIZADOR ═══
function renderCotizador(){
  const PASOS=["Recinto","Cantidad","Puerta","Marco","Bisagras","Servicios","¿+Puertas?","Flete","Final"];
  let h=renderDatos()+renderStep(PASOS);
  if(C.puertas.length>0)h+=renderAcum();
  if(C.paso===1)h+=rP1();
  else if(C.paso===2)h+=rP2();
  else if(C.paso===3)h+=rP3();
  else if(C.paso===4)h+=rP4();
  else if(C.paso===5)h+=rP5();
  else if(C.paso===6)h+=rP6();
  else if(C.paso===7)h+=rP7();
  else if(C.paso===8)h+=rP8();
  const T=totales();
  const glow="font-family:Space Grotesk;font-size:18px;font-weight:800;color:#FFF;text-shadow:0 0 8px rgba(255,255,255,.85);";
  h+=`<div class="sticky-bar no-print">
    <div>${C.puertas.length>0?`<div style="font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;">Total acumulado</div><div style="${glow}">${fmt(T.s)}</div>`:`<div style="font-size:11px;color:var(--txt3);">Paso ${C.paso} / ${PASOS.length}</div>`}</div>
    ${C.paso>=3&&C.paso<=6&&unitPW(C.pw)>0?`<div style="font-size:11px;color:var(--txt2);">Puerta actual: <strong style="color:var(--gold-l);">${fmt(unitPW(C.pw))}</strong> × ${C.pw.cant}</div>`:""}
    <div style="display:flex;gap:8px;">
      ${C.paso>1&&C.paso<=6?`<button class="btn btn-g btn-sm" onclick="C.paso--;renderApp()">← Atrás</button>`:""}
      ${C.paso<=6?`<button class="btn btn-p btn-sm" ${canNext()?"":"disabled"} onclick="${canNext()?"avanzar()":""}">Siguiente →</button>`:""}
    </div>
  </div>`;
  return h;
}

function avanzar(){
  if(C.paso===6){guardarPW();C.paso=7;}
  else C.paso++;
  renderApp();
}
function guardarPW(){C.puertas.push(Object.assign({},C.pw));C.pw={recinto:"",cant:1,tipo:"",modelo:"",relleno:"",ancho:"",alto:"",precioAcero:0,prepintada:null,conVidrio:null,chapero:null,tm:"",am:"",altm:"",matm:"",bis:"",cbis:3,servs:[]};}
function masP(){C.pw={recinto:"",cant:1,tipo:"",modelo:"",relleno:"",ancho:"",alto:"",precioAcero:0,prepintada:null,conVidrio:null,chapero:null,tm:"",am:"",altm:"",matm:"",bis:"",cbis:3,servs:[]};C.paso=1;renderApp();}
function irFlete(){C.paso=8;renderApp();}
function irFinal(){
  if(!C.puertas.length){alert("Agrega al menos una puerta.");return;}
  try{
    C.resumen=true;
    renderApp();
  }catch(e){
    console.error("Error en irFinal:",e);
    alert("Error al generar cotizacion: "+e.message);
    C.resumen=false;
  }
}
function quitarP(i){C.puertas.splice(i,1);renderApp();}

function renderDatos(){
  return`<div class="card" style="margin-bottom:12px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;flex-wrap:wrap;gap:8px;">
      <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);">Cotizacion</div>

          <input style="width:145px;font-family:Space Grotesk;font-weight:700;font-size:12px;color:var(--gold);border-color:rgba(191,136,64,.25);" value="${C.ncot}" oninput="C.ncot=this.value"></div>
        <div style="display:flex;align-items:center;gap:6px;"><span style="font-size:10px;color:var(--txt3);">Fecha</span>

      <div><span class="label">Empresa</span><input placeholder="Razón social" value="${C.empresa}" oninput="C.empresa=this.value" onblur="renderApp()"></div>
      <div><span class="label">Fono / WhatsApp</span><input placeholder="+56 9 XXXX XXXX" value="${C.fono}" oninput="C.fono=this.value" onblur="renderApp()"></div>

function renderStep(P){
  let h=`<div class="stepper no-print">`;
  P.forEach((p,i)=>{const n=i+1,ac=n===C.paso,dn=n<C.paso;h+=`<div class="s-item" ${dn?`onclick="C.paso=${n};renderApp()"`:""} style="gap:5px;"><div class="s-num ${ac?"act":dn?"done":""}">${dn?"✓":n}</div><span class="s-lbl ${ac?"act":dn?"done":""}">${p}</span></div>`;if(i<P.length-1)h+=`<div class="s-line ${dn?"done":""}"></div>`;});
  return h+`</div>`;
}

function renderAcum(){
  let h=`<div class="card" style="margin-bottom:12px;"><div class="section-hdr"><div style="font-size:12px;font-weight:700;color:var(--gold-l);">🚪 Puertas cotizadas (${C.puertas.length})</div><div style="font-size:12px;color:var(--txt2);">Subtotal: <strong style="color:#FFF;">${fmt(totPuertas())}</strong></div></div>`;
  C.puertas.forEach((p,i)=>{const rec=RECINTOS.find(r=>r.id===p.recinto);const u=unitPW(p);h+=`<div class="puerta-item"><div style="display:flex;align-items:center;gap:9px;"><div class="puerta-num">${i+1}</div><div><div style="font-size:13px;font-weight:600;">${rec?rec.ico+" "+rec.n:""} - ${p.tipo} ${p.ancho}×${p.alto}mm</div><div style="font-size:11px;color:var(--txt3);">${p.relleno}${p.tm?" · Marco "+p.tm:""}${p.bis?" · Bisagras":""}</div></div></div><div style="display:flex;align-items:center;gap:10px;"><div style="text-align:right;"><div style="font-size:13px;font-weight:700;color:var(--gold-l);">${fmt(u)} c/u</div><div style="font-size:11px;color:var(--txt3);">× ${p.cant} = ${fmt(u*p.cant)}</div></div><button class="btn btn-red btn-sm" onclick="quitarP(${i})">✕</button></div></div>`;});
  return h+`</div>`;
}

}

  </div>`;

function rP3(){
  const pw=C.pw;
  const esAcero=pw.tipo==="Acero";
  const anchoAcero=[700,750,800,850,900,950,1000];
  const altoAcero=[2000,2100];

  let h=`<div class="step-title">③ Tipo de Puerta</div><div class="step-sub">Materialidad, modelo y medidas.</div>
  <div class="card"><span class="label">Materialidad</span><div class="chips">`;
  TIPOS.forEach(t=>{
    const labels={"MDF MC":"MDF ½ Cuerpo","MDF HR MC":"MDF HR ½ Cuerpo"};
    const displayT=labels[t]||t;
    const colores={"MDF":"","MDF HR":"","F30":"color:var(--gold-l)","F60":"color:#E05050","Enchapada":"color:#3DAF76","Acero":"color:#5B8DD9","MDF MC":"color:#60B0D4","MDF HR MC":"color:#60B0D4"};
    h+=`<button class="chip ${pw.tipo===t?"on":""}" onclick="C.pw.tipo='${t}';C.pw.relleno='';C.pw.ancho='';C.pw.alto='';C.pw.modelo='';C.pw.bis='';C.pw.servs=[];aplicarReglasAuto();renderApp()">${displayT}</button>`;
  });
  h+=`</div></div>`;

  // Modelo
  if(pw.tipo&&MODELOS[pw.tipo]&&MODELOS[pw.tipo].length>1){
    h+=`<div class="card"><span class="label">Modelo / Diseño</span><div class="chips">`;
    MODELOS[pw.tipo].forEach(m=>{
      h+=`<button class="chip ${pw.modelo===m?"on":""}" onclick="C.pw.modelo='${m}';renderApp()">${m}</button>`;

    h+=`</div></div>`;
  } else if(pw.tipo) {
    // Auto-seleccionar único modelo
    if(!pw.modelo&&MODELOS[pw.tipo]&&MODELOS[pw.tipo].length===1) C.pw.modelo=MODELOS[pw.tipo][0];
  }

    h+=`<div class="card"><span class="label">Relleno / Tipo</span><div class="chips">`;
    (RELLENOS[pw.tipo]||[]).forEach(r=>{h+=`<button class="chip ${pw.relleno===r?"on":""}" onclick="C.pw.relleno='${r}';renderApp()">${r}</button>`;});

  }

      ${pw.conVidrio===false?'<div style="font-size:11px;color:var(--txt3);margin-top:8px;">Puerta base ½ cuerpo · 1 luz · sin vidrio</div>':""}

    h+=`<div class="card"><span class="label">¿Puerta Prepintada?</span>
      <div class="chips">
        <button class="chip ${pw.prepintada===true?"on":""}" onclick="C.pw.prepintada=true;renderApp()">✅ Sí - Prepintada</button>
        <button class="chip ${pw.prepintada===false?"on":""}" onclick="C.pw.prepintada=false;renderApp()">🔲 No - Desnuda</button>
      </div>
      ${pw.prepintada===true?'<div style="font-size:11px;color:var(--green-l);margin-top:8px;">Se aplica tarifa prepintada. Incluye acabado color estándar.</div>':""}
      ${pw.prepintada===false?'<div style="font-size:11px;color:var(--txt3);margin-top:8px;">Nota: No se garantizan puertas MDF desnudo para todos los modelos.</div>':""}
    </div>`;
  }

  if(pw.relleno){
    const esMC=pw.tipo==="MDF MC"||pw.tipo==="MDF HR MC";
  const anchoMC=[700,750,800,850,900];
  const altoMC=[2000,2100,2200,2400];
  const anchosDisp=esAcero?anchoAcero:esMC?anchoMC:ANCHOS;

function cambiarEstado(ncot,estado){
  var h=loadH();

function guardarNota(ncot,val){

function cerrarModal(){
  var m=document.getElementById("modal-container");if(m)m.remove();
}

function abrirModal(content){
  cerrarModal();
  var wrap=document.createElement("div");
  wrap.id="modal-container";
  wrap.innerHTML='<div class="modal-bg" id="modal-bg"><div class="modal">'+content+'</div></div>';
  wrap.querySelector("#modal-bg").addEventListener("click",function(e){if(e.target.id==="modal-bg")cerrarModal();});
  document.body.appendChild(wrap);
}

function modalEstado(ncot){
  var cot=loadH().find(function(c){return c.ncot===ncot;});
  if(!cot)return;
  var actual=cot.estado||"pendiente";
  var rows="";
  Object.keys(ESTADOS).forEach(function(k){
    var v=ESTADOS[k];
    var sel=(k===actual);
    rows+='<div data-ncot="'+ncot+'" data-est="'+k+'" class="est-row" style="display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;border:1.5px solid '+(sel?"var(--gold)":"var(--bdr)")+';background:'+(sel?"var(--gold-bg)":"var(--bg3)")+';cursor:pointer;margin-bottom:7px;">';
    rows+='<span style="font-size:18px;">'+v.ico+'</span>';
    rows+='<div style="font-size:13px;font-weight:600;color:'+(sel?"var(--gold-l)":"var(--txt)")+';">'+v.lbl+'</div>';
    if(sel)rows+='<span style="margin-left:auto;color:var(--gold);">&#10003;</span>';
    rows+='</div>';
  });
  var nota=cot.notas||"";
  var content='<div class="modal-title">Estado de Cotizaci&#243;n</div>'
    +'<div style="font-size:13px;color:var(--txt2);margin-bottom:14px;">'+cot.ncot+' &mdash; '+(cot.cliente||"Sin nombre")+'</div>'
    +rows
    +'<div style="margin-top:12px;"><span class="label">Notas internas</span>'
    +'<textarea id="nota-ta" style="height:70px;resize:vertical;" placeholder="Condiciones, plazo, contacto...">'+nota+'</textarea></div>'
    +'<div style="display:flex;justify-content:space-between;margin-top:12px;">'
    +'<button class="btn btn-g btn-sm" id="btn-nota">&#128190; Guardar nota</button>'
    +'<button class="btn btn-g btn-sm" onclick="cerrarModal()">Cerrar</button>'
    +'</div>';
  abrirModal(content);
  setTimeout(function(){
    document.querySelectorAll(".est-row").forEach(function(el){
      el.addEventListener("click",function(){cambiarEstado(el.dataset.ncot,el.dataset.est);});
    });

    if(bn)bn.addEventListener("click",function(){

      if(ta)guardarNota(ncot,ta.value);

function modalPlantillas(){
  var plts=loadPlt();
  var rows="";
  if(!plts.length){
    rows='<div style="text-align:center;padding:20px;color:var(--txt3);">No hay plantillas guardadas.</div>';
  } else {
    plts.forEach(function(p){
      var nP=p.puertas.reduce(function(a,pw){return a+pw.cant;},0);
      rows+='<div class="plantilla-item" data-pid="'+p.id+'" style="cursor:pointer;">';
      rows+='<div><div style="font-size:13px;font-weight:700;">&#11088; '+p.nombre+'</div>';
      rows+='<div style="font-size:11px;color:var(--txt3);">'+nP+' puerta'+(nP>1?"s":"")+" &middot; "+p.fecha+'</div></div>';
      rows+='<button class="btn btn-red btn-sm" data-del="'+p.id+'">&#128465;&#65039;</button></div>';
    });
  }
  var content='<div class="modal-title">&#11088; Plantillas Guardadas</div>'
    +rows
    +'<div style="display:flex;justify-content:flex-end;margin-top:12px;">'
    +'<button class="btn btn-g btn-sm" onclick="cerrarModal()">Cerrar</button></div>';
  abrirModal(content);
  setTimeout(function(){
    document.querySelectorAll(".plantilla-item").forEach(function(el){
      el.addEventListener("click",function(e){if(!e.target.dataset.del)aplicarPlantilla(+el.dataset.pid);});

    document.querySelectorAll("[data-del]").forEach(function(el){
      el.addEventListener("click",function(e){e.stopPropagation();borrarPlantilla(+el.dataset.del);});

// Plantillas
var LS_PLT="indoor_plantillas_2026";
function loadPlt(){try{return JSON.parse(localStorage.getItem(LS_PLT)||"[]");}catch{return[];}}
function savePlt(p){localStorage.setItem(LS_PLT,JSON.stringify(p));}

function guardarPlantilla(){
  if(!C.puertas.length){alert("No hay puertas para guardar como plantilla.");return;}
  var nombre=prompt("Nombre para esta plantilla:");
  if(!nombre)return;
  var plts=loadPlt();
  plts.unshift({id:Date.now(),nombre:nombre,puertas:JSON.parse(JSON.stringify(C.puertas)),fecha:hoy()});
  savePlt(plts);
  alert("Plantilla guardada: "+nombre);
}

function aplicarPlantilla(id){
  var plt=loadPlt().find(function(p){return p.id===id;});
  if(!plt)return;
  if(!confirm("Agregar "+plt.puertas.length+" tipo(s) de la plantilla a la cotizacion actual?"))return;
  plt.puertas.forEach(function(p){C.puertas.push(JSON.parse(JSON.stringify(p)));});
  cerrarModal();C.paso=7;renderApp();
}

function borrarPlantilla(id){
  if(!confirm("Eliminar esta plantilla?"))return;
  savePlt(loadPlt().filter(function(p){return p.id!==id;}));
  cerrarModal();modalPlantillas();
}

function alertaVencimiento(cot){
  var alertarEn=["enviada","revision","pendiente"];
  var estado=cot.estado||"pendiente";
  if(alertarEn.indexOf(estado)===-1)return "";
  if(!cot.fechaISO)return "";
  var dias=Math.floor((Date.now()-new Date(cot.fechaISO).getTime())/(1000*60*60*24));
  if(dias>=30)return '<span style="background:rgba(184,48,48,.25);color:#ff8080;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;">🔴 VENCIDA ('+dias+'d)</span>';
  if(dias>=25)return '<span style="background:rgba(245,158,11,.2);color:#F59E0B;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;">⚠️ Vence en '+(30-dias)+'d</span>';
  if(dias>=20)return '<span style="background:rgba(191,136,64,.15);color:var(--gold-l);padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;">⏰ '+dias+'d</span>';
  return "";
}

function calcKPIConversion(hist){
  var enviadas=hist.filter(function(c){return ["enviada","revision","aprobada","rechazada"].indexOf(c.estado||"")>-1;}).length;
  var aprobadas=hist.filter(function(c){return c.estado==="aprobada";}).length;
  var rechazadas=hist.filter(function(c){return c.estado==="rechazada";}).length;
  var enCurso=hist.filter(function(c){return c.estado==="revision"||c.estado==="enviada";}).length;
  var tasa=enviadas>0?Math.round(aprobadas/enviadas*100):0;
  return{enviadas:enviadas,aprobadas:aprobadas,rechazadas:rechazadas,enCurso:enCurso,tasa:tasa};
}

function calcComparativoMes(hist){
  var ahora=new Date();
  var mesActual=ahora.getFullYear()+"-"+String(ahora.getMonth()+1).padStart(2,"0");
  var antesMes=new Date(ahora.getFullYear(),ahora.getMonth()-1,1);
  var mesAnterior=antesMes.getFullYear()+"-"+String(antesMes.getMonth()+1).padStart(2,"0");
  var totActual=hist.filter(function(c){return c.mes===mesActual;}).reduce(function(a,c){return a+c.totalFinal;},0);
  var totAnterior=hist.filter(function(c){return c.mes===mesAnterior;}).reduce(function(a,c){return a+c.totalFinal;},0);
  var nActual=hist.filter(function(c){return c.mes===mesActual;}).length;
  var nAnterior=hist.filter(function(c){return c.mes===mesAnterior;}).length;
  var pctMonto=totAnterior>0?Math.round((totActual-totAnterior)/totAnterior*100):null;
  var pctN=nAnterior>0?Math.round((nActual-nAnterior)/nAnterior*100):null;
  return{mesActual:mesActual,mesAnterior:mesAnterior,totActual:totActual,totAnterior:totAnterior,nActual:nActual,nAnterior:nAnterior,pctMonto:pctMonto,pctN:pctN};
}

function deltaBadge(pct){
  if(pct===null)return'<span style="font-size:11px;color:var(--txt3);">sin datos ant.</span>';
  if(pct>0)return'<span style="font-size:12px;font-weight:700;color:#3DAF76;">&#9650; +'+pct+'%</span>';
  if(pct<0)return'<span style="font-size:12px;font-weight:700;color:#E05050;">&#9660; '+pct+'%</span>';
  return'<span style="font-size:12px;color:var(--txt3);">= Sin cambio</span>';
}

function buildPipelineBar(hist){
  var out='<div class="pipeline-bar">';
  var keys=["pendiente","enviada","revision","aprobada","rechazada","produccion"];
  keys.forEach(function(est){
    var cnt;
    if(est==="pendiente"){cnt=hist.filter(function(c){return !c.estado||c.estado==="pendiente";}).length;}
    else{cnt=hist.filter(function(c){return c.estado===est;}).length;}
    if(cnt===0)return;
    var e=ESTADOS[est]||ESTADOS.pendiente;
    var sel=(HF.estado===est);
    out+='<button class="estado-badge '+e.cls+'" data-pest="'+est+'" style="cursor:pointer;'+(sel?"outline:2px solid currentColor;":"")+'">';
    out+=e.ico+" "+e.lbl+" <strong>"+cnt+"</strong></button>";
  });
  if(HF.estado){out+='<button class="btn btn-g btn-sm" id="btn-ver-todos" style="font-size:11px;">Ver todos</button>';}
  out+='</div>';
  setTimeout(function(){
    document.querySelectorAll("[data-pest]").forEach(function(el){
      el.addEventListener("click",function(){HF.estado=(HF.estado===el.dataset.pest)?"":el.dataset.pest;renderApp();});
    });
    var bt=document.getElementById("btn-ver-todos");
    if(bt)bt.addEventListener("click",function(){HF.estado="";renderApp();});
  },50);
  return out;
}

function calcTotalesCot(cot){
  var s=(cot.puertas||[]).reduce(function(a,p){return a+unitPW(p)*p.cant;},0)
       +(cot.flete?cot.flete.monto*cot.flete.viajes:0);
  var d=s*((cot.descuento||0)/100);
  var sd=s-d;
  var iv=cot.iva?sd*0.19:0;
  return{s:s,d:d,sd:sd,iv:iv,total:sd+iv};
}

        var dcto=hist[idx].descuento;
        // Approximate recalc
        var newSd=sd*(1-dcto/100)/(1-(hist[idx].descuento||0)/100)*(1-dcto/100);
        hist[idx].totalFinal=hist[idx].iva?newSd*1.19:newSd;
        saveH(hist);
      }
      cerrarModal();
      renderApp();
      alert("✅ Cotizacion actualizada correctamente.");
    });
  },50);
}

      var se=(p.servs||[]).reduce(function(a,id){var s=AS.find(function(x){return x.id===id;});return a+(s?s.p:0);},0);

      var marcoDes=(p.tm&&p.tm!="")?((p.tm==="std"?"Estandar":p.tm)+" "+(p.altm||"")+"mm"):"";
      var bisDes=p.bis?((BISAGRAS.find(function(b){return b.id===p.bis;})||{n:""}).n+" x"+p.cbis):"";
      h2+=c.ncot+"\t"+c.fecha+"\t"+(c.cliente||"")+"\t"+(c.empresa||"")+"\t"+(c.proyecto||"")+"\t"

        +marcoDes+"\t"+(p.matm||"")+"\t"+bisDes+"\t"+servNoms+"\t"
        +p.cant+"\t"+Math.round(unit)+"\t"+Math.round(unit*p.cant)+"\n";
    });
    // Fila flete si existe
    if(c.flete){

    }
  });

  // Exportar como 2 hojas usando XLSX si disponible
  if(typeof XLSX!=="undefined"){

    var ws1=XLSX.utils.aoa_to_sheet(h1.trim().split("\n").map(function(r){return r.split("\t");}));
    var ws2=XLSX.utils.aoa_to_sheet(h2.trim().split("\n").map(function(r){return r.split("\t");}));
    // Ancho de columnas
    ws1["!cols"]=[{wch:16},{wch:14},{wch:20},{wch:22},{wch:14},{wch:22},{wch:14},{wch:8},{wch:18},{wch:10},{wch:14},{wch:14}];
    ws2["!cols"]=[{wch:16},{wch:14},{wch:18},{wch:20},{wch:20},{wch:14},{wch:10},{wch:18},{wch:7},{wch:7},{wch:16},{wch:18},{wch:20},{wch:30},{wch:8},{wch:14},{wch:14}];
    XLSX.utils.book_append_sheet(wb,ws1,"Resumen Cotizaciones");
    XLSX.utils.book_append_sheet(wb,ws2,"Detalle Puertas");
    XLSX.writeFile(wb,"InDooR_Cotizaciones_"+mesK()+".xlsx");
  } else {
    // Fallback a TSV si no hay XLSX
    var combined="=== RESUMEN ===\n"+h1+"\n\n=== DETALLE PUERTAS ===\n"+h2;
    var b=new Blob(["\ufeff"+combined],{type:"text/tab-separated-values;charset=utf-8"});
    var a=document.createElement("a");a.href=URL.createObjectURL(b);
    a.download="InDooR_Cotizaciones_"+mesK()+".xls";a.click();
  }
}

function renderResultadoIA(){

    +'</tr>';

  var totalGeneral = 0;
  res.forEach(function(p,i){
    var bg = i%2===0?'var(--bg2)':'var(--bg3)';
    var precio = p.precioUnit||0;

      +'<td style="padding:8px;text-align:right;">'+(p.alto||'-')+'</td>'

      +'<td style="padding:8px;color:var(--txt2);font-size:11px;">'+(p.marcoDesc||'-')+'</td>'
      +'<td style="padding:8px;text-align:center;font-weight:700;">'+p.cant+'</td>'
      +'<td style="padding:8px;text-align:right;">'+(precio>0?fmt(precio):'<span style="color:var(--red-l);">Consultar</span>')+'</td>'
      +'<td style="padding:8px;text-align:right;font-weight:700;color:var(--gold-l);">'+(precio>0?fmt(sub):'-')+'</td>'
      +'</tr>';
    if(p.servicios&&p.servicios.length>0){
      h += '<tr style="background:'+bg+';"><td colspan="10" style="padding:2px 8px 8px 24px;font-size:11px;color:var(--txt3);">'
        +'⚙️ Servicios: '+p.servicios.join(' · ')
        +'</td></tr>';
    }
    if(p.alerta){
      h += '<tr style="background:rgba(184,48,48,.08);"><td colspan="10" style="padding:4px 8px;font-size:11px;color:var(--red-l);">⚠️ '+p.alerta+'</td></tr>';
    }
  });

  h += '<tr style="background:var(--gold-bg);border-top:2px solid var(--gold);">'
    +'<td colspan="9" style="padding:10px 8px;font-weight:700;color:var(--gold-l);text-transform:uppercase;font-size:11px;">TOTAL ESTIMADO NETO</td>'

  return h;

function construirRefPrecios(){
  // Resumen compacto de precios para el prompt
  var ref="MDF (Carton Honey / Aislapol) - Anchos 600-1100mm:\n";
  [2000,2100,2200].forEach(function(al){
    ref+="  Alto "+al+"mm: ";
    [700,800,900,1000].forEach(function(an){
      var r=PP.MDF&&PP.MDF[al]&&PP.MDF[al][an];
      if(r)ref+=an+"mm=$"+Math.round(r[0]).toLocaleString("es-CL")+"/"+Math.round(r[1]).toLocaleString("es-CL")+" ";
    });

function enriquecerPuerta(p){
  // Recalcular precio con datos reales del sistema
  var pw={
    tipo:p.tipo||"MDF",
    modelo:p.modelo||"",
    relleno:p.relleno||"Carton Honey",
    ancho:p.ancho||0,
    alto:p.alto||0,
    precioAcero:0,
    conVidrio:false,
    cant:p.cant||1,
    tm:p.marcoTipo==="std"?"std":(p.marcoTipo||""),
    am:p.marcoAncho||"",
    altm:p.marcoAlto||0,
    matm:p.marcoMat||"",
    // Bisagras SOLO si el prompt las incluyó explícitamente
    bis:p.bisagraId||"",
    cbis:(p.bisagraId&&p.cantBisagras)?p.cantBisagras:(p.bisagraId?3:0),
    servs:p.servIds||[]
  };

  // Normalizar alto al más cercano disponible
  var altosDisp=[2000,2100,2200,2400];
  var altoCercano=altosDisp.reduce(function(prev,curr){
    return Math.abs(curr-pw.alto)<Math.abs(prev-pw.alto)?curr:prev;
  });
  if(pw.alto>0&&altoCercano!==pw.alto){
    p.alerta=(p.alerta?p.alerta+". ":"")+"Alto normalizado de "+pw.alto+"mm a "+altoCercano+"mm";
    pw.alto=altoCercano;p.alto=altoCercano;
  }

  var precioReal=unitPW(pw);
  // Puerta Acero sin precio manual → asumir 70000
  if(pw.tipo==="Acero"&&(!pw.precioAcero||pw.precioAcero===0)){
    pw.precioAcero=70000;
    precioReal=pBase(pw)+pMarco(pw)+pBisag(pw)+pServs(pw);
    p.alerta=(p.alerta?p.alerta+" | ":"")+"⚠️ ASUMI precio puerta Acero = $70.000. Verificar y modificar en cotizador.";
  }

  // Servicios: mantener todos los que vienen del prompt (ya filtrados por regla 8)
  var serviciosFiltrados=(p.servicios||[]);
  // Solo eliminar pf1/pf2 si no fue explicitamente mencionado "pomo" en servicios
  var tienePomo=serviciosFiltrados.some(function(s){return s.toLowerCase().indexOf("pomo")>-1;});
  var servIdsFiltrados=(pw.servs||[]).filter(function(id){
    if((id==="pf1"||id==="pf2")&&!tienePomo)return false;
    return true;
  });
  pw.servs=servIdsFiltrados;

  return {
    recinto:p.recinto||"Sin recinto",
    tipo:pw.tipo,
    modelo:pw.modelo,
    ancho:pw.ancho,
    alto:pw.alto,
    relleno:pw.relleno,
    prepintada:p.prepintada||false,
    cant:pw.cant,
    marcoDesc:p.marcoDesc||"",
    servicios:serviciosFiltrados,
    precioUnit:precioReal>0?precioReal:(p.precioUnit||0),
    alerta:p.alerta||null,
    _pw:pw
  };
}

function procesarExcelPrecios(ev){
  var file=ev.target.files[0];
  if(!file)return;
  if(typeof XLSX==="undefined"){alert("Librería Excel no cargada. Verifica conexión.");return;}
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:"array"});
      var newPP={MDF:{},"MDF HR":{},F30:{},F60:{},Enchapada:{}};
      var registros=0;
      var sheetNames=wb.SheetNames;
      var hojasMDF=sheetNames.filter(function(n){return n.match(/pintura|mdf|puerta/i);});
      var hojasF30=sheetNames.filter(function(n){return n.match(/f30|cortafuego 30/i);});
      var hojasF60=sheetNames.filter(function(n){return n.match(/f60|cortafuego 60/i);});
      var hojasEnch=sheetNames.filter(function(n){return n.match(/enchap|mara/i);});
      function leerHoja(sheetName,tipo){
        if(!sheetName||!wb.Sheets[sheetName])return;
        var data=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:null});
        data.forEach(function(row){
          if(!row||row.length<3)return;
          var alto=parseInt(row[0]);
          if(![2000,2100,2200,2400].includes(alto))return;
          if(!newPP[tipo][alto])newPP[tipo][alto]={};
          ANCHOS.forEach(function(ancho,ai){
            var val=row[ai+1];
            if(val&&!isNaN(parseFloat(val))){
              var precio=parseFloat(val);
              if(precio>1000){
                var ex=PP[tipo]&&PP[tipo][alto]&&PP[tipo][alto][ancho];
                newPP[tipo][alto][ancho]=[precio,ex&&ex[1]?ex[1]:null];
                registros++;
              }
            }
          });
        });
      }
      if(hojasMDF.length)leerHoja(hojasMDF[0],"MDF");
      if(hojasF30.length)leerHoja(hojasF30[0],"F30");
      if(hojasF60.length)leerHoja(hojasF60[0],"F60");
      if(hojasEnch.length)leerHoja(hojasEnch[0],"Enchapada");
      if(registros===0){alert("No se encontraron precios. Hojas: "+sheetNames.join(", "));return;}
      Object.keys(PP).forEach(function(tipo){if(!Object.keys(newPP[tipo]).length)newPP[tipo]=JSON.parse(JSON.stringify(PP[tipo]));});
      var custom={fecha:hoy(),registros:registros,pp:newPP,archivo:file.name};
      localStorage.setItem("indoor_precios_custom",JSON.stringify(custom));
      window.PP_CUSTOM=newPP;
      alert("✅ "+registros+" precios cargados · "+file.name);
      renderApp();
    }catch(err){alert("Error al leer Excel: "+err.message);}
  };
  reader.readAsArrayBuffer(file);
}

  doc.setFont("helvetica","bold");doc.setFontSize(8);
  doc.setTextColor(GOLD[0],GOLD[1],GOLD[2]);
  doc.text(C.ncot,W-M,10,{align:"right"});
  doc.setFont("helvetica","normal");doc.setFontSize(7.5);
  doc.setTextColor(LGRAY[0],LGRAY[1],LGRAY[2]);
  doc.text(C.fecha,W-M,15,{align:"right"});
  doc.text("Claudio Uribe · Ejecutivo Comercial",W-M,20,{align:"right"});

  // Título COTIZACIÓN centrado
  doc.setFont("helvetica","bold");doc.setFontSize(22);
  doc.setTextColor(WHITE[0],WHITE[1],WHITE[2]);
  doc.text("COTIZACIÓN",W/2,23,{align:"center"});
  y=36;

  // ── DATOS CLIENTE ──
  rect([22,22,28],M-2,y-4,W-2*(M-2),20,true);
  txt("CLIENTE",M,y,7,GOLD,"bold");y+=5;
  if(C.cliente){txt(C.cliente+(C.empresa?" - "+C.empresa:""),M,y,10,WHITE,"bold");y+=5;}
  var row2=[];
  if(C.fono)row2.push("📞 "+C.fono);
  if(C.email)row2.push(C.email);
  if(row2.length){txt(row2.join("   ·   "),M,y,7.5,LGRAY);y+=4;}
  if(C.proyecto){txt("📍 Proyecto: "+C.proyecto,M,y,8,[210,180,100]);y+=5;}
  y+=4;

  // ── DETALLE POR RECINTO ──
  C.puertas.forEach(function(p,i){
    chk(50);
    var rec=RECINTOS.find(function(r){return r.id===p.recinto;});
    var dsg=desglosePW(p);
    var modeloStr=(p.modelo&&p.modelo!=="Lisa")?" "+p.modelo:""; var chaperoStr=p.chapero?" · Chapero "+p.chapero+"mm":"";
    var esAcero=p.tipo==="Acero";
    var medStr=esAcero?"":"  "+p.ancho+"×"+p.alto+"mm";

    // Cabecera recinto - fondo dorado
    rect(GOLD,M-2,y-4,W-2*(M-2),8,true);
    doc.setFont("helvetica","bold");doc.setFontSize(9);
    doc.setTextColor(255,255,255);
    doc.text((i+1)+". "+(rec?rec.n:""),M,y);
    doc.text(p.cant+" unidades",W-M,y,{align:"right"});
    y+=6;

    // Descripción puerta
    rect([24,24,30],M-2,y-3,W-2*(M-2),6,true);
    txt(p.tipo+modeloStr+medStr+" - "+p.relleno,M,y,8,[220,200,150],"bold");
    txt("Espesor: "+(["F30","F60","Acero"].includes(p.tipo)?"45mm":"40-46mm")+" · Batiente pino simple",W-M,y,7,LGRAY,"normal","right");
    y+=7;

    // Grid desglose
    var cols=[M,M+75,M+105,M+140,W-M];
    // Header tabla
    doc.setFillColor(35,34,40);doc.rect(M-2,y-3.5,W-2*(M-2),5.5,"F");
    txt("Componente",cols[0],y,7,LGRAY,"bold");
    txt("P. Unitario",cols[2],y,7,LGRAY,"bold","right");
    txt("Cantidad",cols[3],y,7,LGRAY,"bold","right");
    txt("Subtotal",cols[4],y,7,LGRAY,"bold","right");
    y+=5;

    // Puerta base
    doc.setFillColor(20,20,24);doc.rect(M-2,y-3.5,W-2*(M-2),5.5,"F");
    txt("Puerta base"+(p.modelo==="Llaima"?" + Llaima":""),cols[0],y,8,WHITE);
    txt(money(dsg.pb),cols[2],y,8,WHITE,"normal","right");
    txt("×"+p.cant,cols[3],y,8,LGRAY,"normal","right");
    doc.setFont("helvetica","bold");doc.setFontSize(8);
    doc.setTextColor(WHITE[0],WHITE[1],WHITE[2]);
    doc.text(money(dsg.pbT),cols[4],y,{align:"right"});
    y+=5.5;

    // Marco
    if(dsg.ma>0){
      doc.setFillColor(18,22,18);doc.rect(M-2,y-3.5,W-2*(M-2),5.5,"F");
      txt("Marco "+(p.tm==="std"?"Estandar":p.tm)+" "+p.matm+" "+p.altm+"mm",cols[0],y,8,WHITE);
      txt(money(dsg.ma),cols[2],y,8,WHITE,"normal","right");
      txt("×"+p.cant,cols[3],y,8,LGRAY,"normal","right");
      doc.setFont("helvetica","bold");doc.setFontSize(8);
      doc.setTextColor(GREEN[0]+60,GREEN[1]+100,GREEN[2]+60);
      doc.text(money(dsg.maT),cols[4],y,{align:"right"});
      y+=5.5;
    }
    // Bisagras
    if(dsg.bi>0){
      var bNom=BISAGRAS.find(function(x){return x.id===p.bis;})||{n:""};
      doc.setFillColor(18,18,25);doc.rect(M-2,y-3.5,W-2*(M-2),5.5,"F");
      txt("Bisagras "+p.cbis+"× "+bNom.n,cols[0],y,8,WHITE);
      txt(money(dsg.bi),cols[2],y,8,WHITE,"normal","right");
      txt("×"+p.cant,cols[3],y,8,LGRAY,"normal","right");
      doc.setFont("helvetica","bold");doc.setFontSize(8);
      doc.setTextColor(167,139,250);
      doc.text(money(dsg.biT),cols[4],y,{align:"right"});
      y+=5.5;
    }
    // Servicios
    (p.servs||[]).forEach(function(id){
      var sv=AS.find(function(x){return x.id===id;});if(!sv)return;
      var mk="spx_"+id;var mult=sv.mult||1;var spBase=sv.manual?(p[mk]||0):sv.p;var sp=spBase*mult;if(sp===0)return;
      doc.setFillColor(16,16,20);doc.rect(M-2,y-3.5,W-2*(M-2),5.5,"F");
      txt(sv.n,cols[0],y,7.5,[210,200,185]);
      txt(money(sp),cols[2],y,7.5,[210,200,185],"normal","right");
      txt("×"+p.cant,cols[3],y,7.5,LGRAY,"normal","right");
      doc.setFont("helvetica","bold");doc.setFontSize(7.5);
      doc.setTextColor(GOLD[0],GOLD[1],GOLD[2]);
      doc.text(money(sp*p.cant),cols[4],y,{align:"right"});
      y+=5.5;
      chk(8);
    });

    // Total recinto
    rect(GOLDD,M-2,y-3,W-2*(M-2),6.5,true);
    doc.setFont("helvetica","bold");doc.setFontSize(9);
    doc.setTextColor(255,255,255);
    doc.text("SUBTOTAL RECINTO",M,y);
    doc.text(money(dsg.total),W-M,y,{align:"right"});
    y+=9;
    chk(15);
  });

  // ── FLETE ──
  if(C.flete&&totFlete()>0){
    chk(12);
    rect([30,45,85],M-2,y-3.5,W-2*(M-2),9,true);
    doc.setFont("helvetica","bold");doc.setFontSize(9);
    doc.setTextColor(BLUE[0]+80,BLUE[1]+80,255);
    doc.text("FLETE - "+C.flete.destino,M,y);
    doc.text(money(totFlete()),W-M,y,{align:"right"});
    doc.setFont("helvetica","normal");doc.setFontSize(7.5);
    doc.setTextColor(LGRAY[0],LGRAY[1],LGRAY[2]);
    doc.text(C.flete.transportista+" · "+C.flete.viajes+" viaje"+(C.flete.viajes>1?"s":"")+" × "+money(C.flete.monto),M,y+4);
    if(C.flete.comentario){
      doc.setFontSize(7);doc.setTextColor(LGRAY[0],LGRAY[1],LGRAY[2]);
      doc.text("Ref: "+C.flete.comentario.substring(0,90),M,y+8);
    }
    y+=11;
  }

  // ── TOTALES ──
  chk(45);
  var T=totales();
  var txLeft=M+60;
  rect([28,25,18],txLeft-4,y-4,W-txLeft-M+6,T.d>0?40:30,true);
  rect(GOLD,txLeft-4,y-4,1.5,T.d>0?40:30,true);

  doc.setFont("helvetica","normal");doc.setFontSize(9);
  doc.setTextColor(LGRAY[0],LGRAY[1],LGRAY[2]);
  doc.text("Subtotal",txLeft+2,y);
  doc.setFont("helvetica","bold");
  doc.setTextColor(WHITE[0],WHITE[1],WHITE[2]);
  doc.text(money(T.s),W-M,y,{align:"right"});y+=7;

  if(T.d>0){
    doc.setFont("helvetica","normal");doc.setFontSize(8.5);
    doc.setTextColor(LGRAY[0],LGRAY[1],LGRAY[2]);
    doc.text("Descuento "+C.descuento+"%",txLeft+2,y);
    doc.setFont("helvetica","bold");doc.setFontSize(8.5);
    doc.setTextColor(RED[0]+40,RED[1]+40,RED[2]+40);
    var descStr="-"+money(T.d);
    doc.text(descStr,W-M,y,{align:"right"});y+=7;
    doc.setFont("helvetica","normal");doc.setFontSize(8.5);
    doc.setTextColor(LGRAY[0],LGRAY[1],LGRAY[2]);
    doc.text("Subtotal c/descuento",txLeft+2,y);
    doc.setFont("helvetica","bold");doc.setFontSize(8.5);
    doc.setTextColor(WHITE[0],WHITE[1],WHITE[2]);
    doc.text(money(T.sd),W-M,y,{align:"right"});y+=7;
  }
  if(C.iva){
    doc.setFont("helvetica","normal");doc.setFontSize(9);
    doc.setTextColor(LGRAY[0],LGRAY[1],LGRAY[2]);
    doc.text("IVA 19%",txLeft+2,y);
    doc.setFont("helvetica","bold");
    doc.setTextColor(WHITE[0],WHITE[1],WHITE[2]);
    doc.text(money(T.iv),W-M,y,{align:"right"});y+=7;
  }

  // Total final - bloque dorado
  rect(GOLD,txLeft-4,y-4,W-txLeft-M+6,12,true);
  doc.setFont("helvetica","bold");doc.setFontSize(10);
  doc.setTextColor(255,255,255);
  doc.text("TOTAL "+(C.iva?"CON IVA":"NETO")+(C.descuento>0?" ("+C.descuento+"% dcto)":""),txLeft+2,y+2);
  doc.setFontSize(13);
  doc.text(money(T.total),W-M,y+2,{align:"right"});
  y+=16;

  // ── PIE DE PÁGINA ──
  var pageH=doc.internal.pageSize.getHeight();
  rect(DARK,0,pageH-14,W,14,true);
  rect(GOLD,0,pageH-14,W,0.8,true);
  doc.setFont("helvetica","normal");doc.setFontSize(7);
  doc.setTextColor(LGRAY[0],LGRAY[1],LGRAY[2]);
  doc.text("* Precios netos CLP sin IVA. Válido 30 días. Sujeto a disponibilidad de stock. No incluye flete salvo el indicado.",W/2,pageH-9,{align:"center"});
  doc.setTextColor(GOLD[0],GOLD[1],GOLD[2]);
  doc.text("InDooR SpA · indoor-spa.cl · ventas@indoor-spa.cl · Claudio Uribe",W/2,pageH-5,{align:"center"});

  doc.save("Cotizacion_"+C.ncot+".pdf");
}

</script>
</body>
</html>
